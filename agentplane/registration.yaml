apiVersion: sourceos.dev/v1alpha1
kind: AgentPlaneCapability
metadata:
  name: bearbrowser-runtime
  labels:
    sourceos.dev/product: BearBrowser
spec:
  capability: browser.runtime
  provider: BearBrowser
  modes:
    - human-secure
    - agent-runtime
  launchContract:
    requiredFields:
      - sessionId
      - agentId
      - workspaceId
      - profileMode
      - policyBundleId
      - mountPlanId
    optionalFields:
      - initialUrl
      - ttlMinutes
      - automationSurface
      - terminalBackend
      - credentialBrokerPolicyId
    defaultProfileMode: agent-runtime
    defaultTtlMinutes: 120
    requiresPolicyDecision: true
    requiresProvenanceSink: true
  sessionStates:
    - requested
    - policy-pending
    - starting
    - running
    - credential-pending
    - credential-denied
    - blocked
    - ending
    - ended
    - failed
  credentialBroker:
    contract: policy/credential-broker-contract.yaml
    macOSBackends: credential-broker/macos-backends.yaml
    linuxBackends: credential-broker/linux-backends.yaml
    humanSecureUsesOSNativeBroker: true
    agentRuntimeInheritsHumanCredentials: false
    eventPayloadSecrets: forbidden
  automationSurfaces:
    - name: playwright
      capability: browser.playwright
      controlPlane: deterministic
      policyMediated: true
      remoteDebuggingDefault: denied
      wrapper: bearbrowser-playwright
    - name: stagehand
      capability: browser.stagehand
      controlPlane: ai-assisted
      policyMediated: true
      requiresObservationEvents: true
      wrapper: bearbrowser-stagehand
    - name: carbonyl
      capability: browser.terminal.carbonyl
      controlPlane: terminal-browser
      policyMediated: true
      wrapper: bearbrowser-terminal
    - name: browsh
      capability: browser.terminal.browsh
      controlPlane: terminal-browser
      policyMediated: true
      wrapper: bearbrowser-terminal
    - name: elinks
      capability: browser.terminal.elinks
      controlPlane: terminal-browser
      policyMediated: true
      wrapper: bearbrowser-terminal
    - name: lynx
      capability: browser.terminal.lynx
      controlPlane: terminal-browser
      policyMediated: true
      wrapper: bearbrowser-terminal
    - name: w3m-links
      capability: browser.terminal.text-browser-fallback
      controlPlane: terminal-browser
      policyMediated: true
      wrapper: bearbrowser-terminal
  governedResources:
    - network
    - filesystem
    - downloads
    - screenshots
    - domSnapshots
    - pdfExports
    - harFiles
    - cookies
    - credentials
    - nativeMessaging
    - extensions
    - clipboard
    - mediaDevices
    - remoteDebugging
  sinks:
    policyDecisions: PolicyFabric
    provenanceEvents: AgentPlane
    workspaceState: ProphetWorkspace
  provenanceEvents:
    - browser.session.started
    - browser.session.ended
    - browser.navigation.requested
    - browser.navigation.completed
    - browser.download.created
    - browser.capture.created
    - browser.policy.violation
    - browser.credential.boundary
    - browser.credential.requested
    - browser.credential.granted
    - browser.credential.denied
    - browser.credential.cleared
