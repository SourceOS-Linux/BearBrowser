name: bearbrowser
base: core22
version: '140.12.0esr-1'
summary: Gecko-first privacy browser with 101 fingerprinting protections
description: |
  BearBrowser is built on Firefox ESR with a 101-surface
  fingerprinting shield. No telemetry, no cloud sync, anti-tracking built in.
grade: stable
confinement: strict

apps:
  bearbrowser:
    command: bin/bearbrowser
    plugs:
      - network
      - network-bind
      - home
      - x11
      - wayland
      - opengl
      - audio-playback
      - browser-support
      - removable-media

parts:
  bearbrowser:
    plugin: nil
    source: .
    build-packages:
      - tar
    override-build: |
      set -e
      # Single source of truth for the real binary tarball + SHA256.
      . packaging/linux/binary-source.env
      VARIANT="${BEARBROWSER_SNAP_VARIANT:-human}"
      case "$VARIANT" in
        human) TARBALL="$BEARBROWSER_HUMAN_TARBALL"; EXPECT_SHA="$BEARBROWSER_HUMAN_SHA256" ;;
        tor)   TARBALL="$BEARBROWSER_TOR_TARBALL";   EXPECT_SHA="$BEARBROWSER_TOR_SHA256" ;;
        *) echo "Unknown variant $VARIANT" >&2; exit 2 ;;
      esac

      STAGED="dist/linux/$TARBALL"
      if [ ! -f "$STAGED" ]; then
        mkdir -p dist/linux
        gcloud storage cp "$BEARBROWSER_GCS_BASE/$TARBALL" "$STAGED"
      fi
      ACTUAL_SHA="$(sha256sum "$STAGED" | awk '{print $1}')"
      [ "$ACTUAL_SHA" = "$EXPECT_SHA" ] || { echo "SHA256 mismatch: $ACTUAL_SHA != $EXPECT_SHA" >&2; exit 4; }

      # Extract the full Gecko runtime (tarball root is bin/).
      mkdir -p "$SNAPCRAFT_PART_INSTALL/lib/bearbrowser" "$SNAPCRAFT_PART_INSTALL/bin"
      tar -xzf "$STAGED" -C "$SNAPCRAFT_PART_INSTALL/lib/bearbrowser"
      install -Dm644 profiles/default/user.js "$SNAPCRAFT_PART_INSTALL/lib/bearbrowser/defaults/profile/user.js"
      printf '#!/bin/sh\nexec $SNAP/lib/bearbrowser/%s --profile $SNAP_USER_DATA/.bearbrowser/profiles/default "$@"\n' \
        "$BEARBROWSER_LAUNCHER_REL" > "$SNAPCRAFT_PART_INSTALL/bin/bearbrowser"
      chmod 755 "$SNAPCRAFT_PART_INSTALL/bin/bearbrowser"
