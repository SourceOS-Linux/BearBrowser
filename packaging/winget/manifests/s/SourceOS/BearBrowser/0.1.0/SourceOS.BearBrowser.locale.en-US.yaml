ShortDescription: Gecko-first privacy browser with 101 JS fingerprinting protections
Description: |
  BearBrowser is a privacy-first browser built on Firefox ESR with a comprehensive
  fingerprinting protection layer (101 surfaces).

  Features:
  - Gecko engine (Firefox ESR 140) — rides ESR cohort for crowd anonymity
  - 101 JS fingerprinting protections: Canvas, WebGL, AudioContext, Fonts,
    Navigator, Screen, Timing, WebRTC, Sensors, Battery, Hardware concurrency
  - OS spoof layer — normalized platform reporting
  - Anti-tracking baked in (no extension required)
  - No telemetry, no Google sync, completely offline-capable
  - Registers as Windows default browser option
