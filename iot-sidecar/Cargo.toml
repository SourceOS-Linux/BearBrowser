[package]
name = "iot-sidecar"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "BearBrowser smart-home / IoT control-plane sidecar. Every device command is governed by the canonical agent-control-bridge policy engine; loopback-only; no telemetry."
license = "MPL-2.0"
publish = false

[[bin]]
name = "iot-sidecar"
path = "src/main.rs"

[dependencies]
# Async runtime + HTTP/WS server (loopback only).
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "net", "process", "sync", "signal", "io-util", "time"] }
axum = { version = "0.7", features = ["ws", "json", "tokio"] }

# Serialization of the wire API and the bridge Decision JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Adapter trait is async.
async-trait = "0.1"

# Error handling.
anyhow = "1"
thiserror = "1"

# State store — bundled so it compiles with no system libsqlite3.
rusqlite = { version = "0.31", features = ["bundled"] }

# Event streams (adapter subscribe + WS fan-out).
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

# Structured logging (stderr only; never the network).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Device/event ids.
uuid = { version = "1", features = ["v4"] }
