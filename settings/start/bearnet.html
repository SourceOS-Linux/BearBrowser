<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- BearNet — live network map + intelligence. A force-graph AND a world map of
     every endpoint the browser (or the whole machine) is talking to, fed by the
     capture-sidecar's no-root connection monitor. Local geo+ASN+owner instantly;
     click any endpoint for on-demand WHOIS/RDAP (who owns the block, CIDR,
     allocation date). Packaged at resource:///bearstart/bearnet.html. -->
<meta name="bearbrowser-bootstrap" content="BearNet network map active">
<title>BearNet — Network</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#0a0c0b; --panel:#10141200; --border:rgba(255,255,255,.09); --text:#e8f0ea;
  --muted:#7f8b83; --accent:#45c87a; --accent-dim:#1b6b45;
  --tracker:#ff5d5d; --analytics:#ffab48; --cdn:#4dabf7; --unknown:#8b978f;
  --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
html,body { height:100%; background:var(--bg); color:var(--text);
  font-family:'DM Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased; overflow:hidden; }
#stage { position:fixed; inset:0; } canvas { display:block; width:100%; height:100%; }
.bar { position:fixed; top:0; left:0; right:0; height:52px; display:flex; align-items:center; gap:11px;
  padding:0 16px; z-index:5; background:linear-gradient(180deg,rgba(10,12,11,.92),rgba(10,12,11,0)); }
.mark { width:28px; height:28px; border-radius:8px; background:var(--accent-dim); display:flex; align-items:center; justify-content:center; font-size:15px; }
.title { font-size:15px; font-weight:600; letter-spacing:-.2px; }
.seg { display:flex; background:#161b18; border:1px solid var(--border); border-radius:9px; overflow:hidden; }
.seg button { font:inherit; font-size:12px; color:var(--muted); background:none; border:none; padding:6px 12px; cursor:pointer; }
.seg button.on { background:var(--accent-dim); color:#eafff2; }
.spacer { flex:1; }
.status { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted); }
.dot { width:7px; height:7px; border-radius:50%; background:var(--muted); }
.dot.live { background:var(--accent); box-shadow:0 0 7px var(--accent); } .dot.err { background:var(--tracker); }
.counts { position:fixed; top:60px; left:16px; z-index:4; font-size:12px; color:var(--muted); }
.counts b { color:var(--text); font-weight:600; font-variant-numeric:tabular-nums; }
.legend { position:fixed; bottom:14px; left:16px; z-index:4; display:flex; gap:14px; font-size:11px; color:var(--muted); }
.legend i { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:middle; }

/* detail popover */
.detail { position:fixed; z-index:6; width:288px; background-color:rgba(18,23,20,.9); backdrop-filter:blur(20px);
  border:1px solid var(--border); border-radius:14px; padding:15px; box-shadow:0 10px 44px rgba(0,0,0,.55); display:none; }
.detail.show { display:block; }
.detail .dom { font-size:15px; font-weight:600; word-break:break-all; margin-bottom:3px; }
.detail .cat { font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
.detail .rows { margin-top:11px; font-size:11.5px; line-height:1.6; }
.detail .rows .r { display:flex; gap:8px; }
.detail .rows .k { color:var(--muted); width:66px; flex-shrink:0; }
.detail .rows .v { color:var(--text); font-family:var(--mono); font-size:11px; word-break:break-all; }
.detail .acts { display:flex; gap:8px; margin-top:13px; }
.detail button { flex:1; font:inherit; font-size:12.5px; font-weight:500; color:var(--text); background:#1b211d;
  border:1px solid var(--border); border-radius:9px; padding:8px; cursor:pointer; }
.detail button.block:hover { border-color:var(--tracker); color:var(--tracker); }
.detail button.block.on { background:rgba(255,93,93,.16); border-color:var(--tracker); color:var(--tracker); }
.detail button.invest:hover { border-color:var(--cdn); color:var(--cdn); }
.osint { margin-top:11px; padding-top:11px; border-top:1px solid var(--border); font-size:11.5px; line-height:1.6; display:none; }
.osint.show { display:block; } .osint .r { display:flex; gap:8px; } .osint .k { color:var(--muted); width:66px; flex-shrink:0; } .osint .v { font-family:var(--mono); font-size:11px; word-break:break-all; }
.osint .load { color:var(--muted); font-style:italic; }

.cap { position:fixed; bottom:14px; right:16px; z-index:4; display:flex; align-items:center; gap:8px;
  background:rgba(18,23,20,.82); border:1px solid var(--border); border-radius:11px; padding:7px 10px; }
.cap span { font-size:11.5px; color:var(--muted); max-width:240px; }
.cap button { font:inherit; font-size:12px; font-weight:500; color:var(--text); background:#1b211d; border:1px solid var(--border); border-radius:8px; padding:6px 11px; cursor:pointer; }
.cap button:disabled { opacity:.4; cursor:not-allowed; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>

<div class="bar">
  <div class="mark">🐻</div><span class="title">BearNet</span>
  <div class="seg" id="viewSeg"><button data-view="graph" class="on">Graph</button><button data-view="map">Map</button></div>
  <div class="seg" id="scopeSeg"><button data-scope="browser" class="on">Browser</button><button data-scope="system">Whole machine</button></div>
  <div class="spacer"></div>
  <div class="status"><span class="dot" id="dot"></span><span id="stat">connecting…</span></div>
</div>

<div class="counts"><b id="cNodes">0</b> endpoints · <b id="cBlocked">0</b> blocked · <b id="cTrackers">0</b> trackers<span id="hpWrap" style="display:none"> · <b id="cHoney" style="color:var(--tracker)">0</b> 🍯 fingerprinting</span><span id="xfWrap" style="display:none"> · <b id="cXfil" style="color:var(--tracker)">0</b> ⛔ exfil blocked</span></div>
<div class="legend">
  <span><i style="background:var(--tracker)"></i>Tracker</span><span><i style="background:var(--analytics)"></i>Analytics</span>
  <span><i style="background:var(--cdn)"></i>CDN</span><span><i style="background:var(--unknown)"></i>Other</span>
</div>

<div class="detail" id="detail">
  <div class="dom" id="dDom"></div><div class="cat" id="dCat"></div>
  <div class="rows" id="dRows"></div>
  <div class="osint" id="dOsint"></div>
  <div class="acts">
    <button class="block" id="dBlock">Block</button>
    <button class="invest" id="dInvest">Investigate</button>
  </div>
</div>

<div class="cap"><span class="cs" id="capStat">packet capture…</span><button id="capBtn" disabled>Capture</button></div>

<script>
(function () {
  "use strict";
  var cfg = (window.__COCKPIT_CONFIG__ && window.__COCKPIT_CONFIG__.bases) || {};
  var BASE = (cfg.capture || "http://127.0.0.1:8093").replace(/\/$/,"");
  var WS = BASE.replace(/^http/,"ws") + "/events";
  var $ = function(id){ return document.getElementById(id); };
  var COLORS = { tracker:"#ff5d5d", analytics:"#ffab48", cdn:"#4dabf7", unknown:"#8b978f" };
  function catColor(c){ return COLORS[c]||COLORS.unknown; }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

  // Deep-linkable: ?view=map&scope=system opens straight into that state.
  var _q = new URLSearchParams(location.search);
  var view = (_q.get("view") === "map") ? "map" : "graph";   // graph | map
  var _initialScope = (_q.get("scope") === "system") ? "system" : "browser";
  var cv = $("c"), ctx = cv.getContext("2d"), W=0,H=0, DPR=Math.min(window.devicePixelRatio||1,2);
  function resize(){ W=cv.clientWidth; H=cv.clientHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
  window.addEventListener("resize", resize); resize();

  // ── graph model: one node per domain ──────────────────────────────
  var nodes = new Map();      // domain -> node
  var conns = new Map();      // key -> {domain}
  var selected=null, hover=null;

  function nodeFor(rec){
    var n = nodes.get(rec.domain);
    if(!n){ var a=Math.random()*6.28, rad=120+Math.random()*120;
      n = { domain:rec.domain, cat:rec.category, count:0, blocked:rec.blocked, procs:new Set(),
            x:W/2+Math.cos(a)*rad, y:H/2+Math.sin(a)*rad, vx:0, vy:0, r:6, geo:null, remoteIP:null };
      nodes.set(rec.domain,n); }
    n.cat=rec.category; n.blocked=rec.blocked; n.dying=null;
    if(rec.process) n.procs.add(rec.process);
    if(rec.geo){ n.geo=rec.geo; }
    if(rec.remote){ n.remoteIP = rec.remote.replace(/:\d+$/,""); }
    return n;
  }
  function addConn(rec){ var prev=conns.get(rec.key);
    if(prev && prev.domain!==rec.domain) decr(prev.domain);
    if(!prev || prev.domain!==rec.domain) nodeFor(rec).count++; else nodeFor(rec);
    conns.set(rec.key,{domain:rec.domain}); refreshCounts(); }
  function decr(d){ var n=nodes.get(d); if(!n) return; n.count--; if(n.count<=0) n.dying=performance.now(); }
  function closeConn(key){ var c=conns.get(key); if(!c) return; conns.delete(key); decr(c.domain); refreshCounts(); }
  function refreshCounts(){ var live=0,blk=0,trk=0; nodes.forEach(function(n){ if(n.dying)return; live++; if(n.blocked)blk++; if(n.cat==="tracker")trk++; });
    $("cNodes").textContent=live; $("cBlocked").textContent=blk; $("cTrackers").textContent=trk; }

  // ── GRAPH physics ─────────────────────────────────────────────────
  function tickGraph(dt){ var cx=W/2, cy=H/2, arr=[...nodes.values()];
    for(var i=0;i<arr.length;i++){ var a=arr[i]; if(a.drag)continue; var fx=0,fy=0;
      for(var j=0;j<arr.length;j++){ if(i===j)continue; var b=arr[j],dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+.01,d=Math.sqrt(d2); var rep=900/d2; fx+=dx/d*rep; fy+=dy/d*rep; }
      var ddx=a.x-cx,ddy=a.y-cy,dist=Math.sqrt(ddx*ddx+ddy*ddy)+.01, pref=150+210*Math.exp(-a.count*0.25);
      var k=(dist-pref)*0.012; fx-=ddx/dist*k*dist*0.02; fy-=ddy/dist*k*dist*0.02; fx-=ddx*.0008; fy-=ddy*.0008;
      a.vx=(a.vx+fx*dt)*0.86; a.vy=(a.vy+fy*dt)*0.86; a.x+=a.vx; a.y+=a.vy; }
    nodes.forEach(function(n,k){ var target=n.dying?0:Math.min(6+Math.sqrt(n.count)*4.5,30); n.r+=(target-n.r)*(n.dying?0.04:0.15); if(n.dying&&n.r<0.5) nodes.delete(k); });
  }
  function drawGraph(){ ctx.clearRect(0,0,W,H); var cx=W/2,cy=H/2;
    ctx.lineWidth=1; nodes.forEach(function(n){ var al=n.dying?0.05:0.14; ctx.strokeStyle=n.blocked?"rgba(255,93,93,"+al+")":"rgba(120,200,150,"+al+")"; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(n.x,n.y); ctx.stroke(); });
    var g=ctx.createRadialGradient(cx,cy,2,cx,cy,26); g.addColorStop(0,"#45c87a"); g.addColorStop(1,"#1b6b45"); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,17,0,7); ctx.fill();
    ctx.font="15px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("🐻",cx,cy+1);
    nodes.forEach(function(n){ var col=catColor(n.cat), a=n.dying?Math.max(0,n.r/6*0.5):1; ctx.globalAlpha=a;
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,7); ctx.fillStyle=n.blocked?"rgba(255,93,93,.18)":col; ctx.fill();
      if(n.blocked){ ctx.lineWidth=2; ctx.strokeStyle=col; ctx.stroke(); }
      if(n===hover||n===selected){ ctx.lineWidth=2; ctx.strokeStyle="#fff"; ctx.stroke(); }
      if(n.r>11||n===hover||n===selected){ ctx.globalAlpha=a*0.9; ctx.fillStyle="#cfe8d8"; ctx.font="11px 'DM Sans',sans-serif"; ctx.textAlign="center"; ctx.textBaseline="top"; ctx.fillText(n.domain.length>22?n.domain.slice(0,21)+"…":n.domain,n.x,n.y+n.r+3); }
      ctx.globalAlpha=1; });
  }

  // ── MAP view (equirectangular) ────────────────────────────────────
  var world=null;
  fetch("world.json").then(function(r){return r.json();}).then(function(w){ world=w; }).catch(function(){});
  function proj(lon,lat){ return [ (lon+180)/360*W, (90-lat)/180*H ]; }
  function drawMap(){ ctx.clearRect(0,0,W,H);
    ctx.fillStyle="#0c1a12"; ctx.fillRect(0,0,W,H);
    if(world){ ctx.strokeStyle="rgba(120,200,150,.20)"; ctx.fillStyle="rgba(40,80,58,.35)"; ctx.lineWidth=0.6;
      world.features.forEach(function(f){ var g=f.geometry, polys = g.type==="Polygon"?[g.coordinates]:g.coordinates;
        polys.forEach(function(poly){ poly.forEach(function(ring){ ctx.beginPath();
          for(var i=0;i<ring.length;i++){ var p=proj(ring[i][0],ring[i][1]); if(i===0)ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]); }
          ctx.closePath(); ctx.fill(); ctx.stroke(); }); }); });
    }
    // endpoint dots at their geo location
    nodes.forEach(function(n){ if(n.dying) return; var geo=n.geo; if(!geo||geo.lat==null||geo.lon==null) return;
      var p=proj(geo.lon,geo.lat), col=catColor(n.cat), rr=Math.min(4+Math.sqrt(n.count)*2.4,13);
      n._mx=p[0]; n._my=p[1]; n._mr=rr;
      ctx.beginPath(); ctx.arc(p[0],p[1],rr,0,7); ctx.fillStyle=n.blocked?"rgba(255,93,93,.85)":col; ctx.globalAlpha=0.9; ctx.fill();
      ctx.globalAlpha=0.25; ctx.beginPath(); ctx.arc(p[0],p[1],rr+4,0,7); ctx.fillStyle=col; ctx.fill(); ctx.globalAlpha=1;
      if(n===hover||n===selected){ ctx.lineWidth=2; ctx.strokeStyle="#fff"; ctx.beginPath(); ctx.arc(p[0],p[1],rr+2,0,7); ctx.stroke();
        ctx.fillStyle="#eafff2"; ctx.font="11px 'DM Sans',sans-serif"; ctx.textAlign="center"; ctx.textBaseline="bottom"; ctx.fillText(n.domain,p[0],p[1]-rr-4); } });
  }

  var last=performance.now();
  function loop(now){ var dt=Math.min((now-last)/16.67,3); last=now;
    if(view==="graph"){ tickGraph(dt); drawGraph(); } else { drawMap(); }
    requestAnimationFrame(loop); }
  requestAnimationFrame(loop);

  // ── hit-testing ───────────────────────────────────────────────────
  function nodeAt(mx,my){ var best=null,bd=1e9;
    nodes.forEach(function(n){ if(n.dying)return;
      var x = view==="graph"?n.x:n._mx, y = view==="graph"?n.y:n._my, rr = view==="graph"?n.r:n._mr;
      if(x==null) return; var d=Math.hypot(x-mx,y-my); if(d<Math.max((rr||6)+4,10)&&d<bd){bd=d;best=n;} });
    return best; }
  cv.addEventListener("mousemove",function(e){ var r=cv.getBoundingClientRect(); hover=nodeAt(e.clientX-r.left,e.clientY-r.top); cv.style.cursor=hover?"pointer":"default"; });
  cv.addEventListener("click",function(e){ var r=cv.getBoundingClientRect(); var n=nodeAt(e.clientX-r.left,e.clientY-r.top); selected=n; if(n) showDetail(n,e.clientX,e.clientY); else hideDetail(); });

  // ── detail popover (local geo instant + Investigate → RDAP) ───────
  function showDetail(n,px,py){ var d=$("detail");
    $("dDom").textContent=n.domain; $("dCat").textContent=n.cat; $("dCat").style.color=catColor(n.cat);
    var g=n.geo||{}, rows="";
    function row(k,v){ return v?("<div class='r'><span class='k'>"+k+"</span><span class='v'>"+esc(v)+"</span></div>"):""; }
    rows += row("Where", [g.city,g.country].filter(Boolean).join(", "));
    rows += row("ASN", g.asn?("AS"+g.asn+(g.org?" · "+g.org:"")):(g.org||""));
    rows += row("IP", n.remoteIP);
    rows += row("Seen via", [...n.procs].slice(0,3).join(", "));
    rows += row("Connections", String(n.count));
    $("dRows").innerHTML = rows || "<div class='r'><span class='v' style='color:var(--muted)'>no local data</span></div>";
    $("dOsint").className="osint"; $("dOsint").innerHTML="";
    $("dBlock").className="block"+(n.blocked?" on":""); $("dBlock").textContent=n.blocked?"Unblock":"Block";
    $("dBlock").onclick=function(){ setRule(n.domain, n.blocked?"allow":"block"); };
    $("dInvest").disabled=!n.remoteIP; $("dInvest").onclick=function(){ investigate(n); };
    d.style.left=Math.min(px+14,W-302)+"px"; d.style.top=Math.min(py+8,H-260)+"px"; d.classList.add("show");
  }
  function hideDetail(){ $("detail").classList.remove("show"); }

  function investigate(n){ if(!n.remoteIP) return; var o=$("dOsint"); o.className="osint show";
    o.innerHTML="<div class='load'>scanning registry, ports, reverse-IP, certs…</div>";
    post("/osint", gesture({ip:n.remoteIP, domain:n.domain, approvalToken:"action:osint"})).then(function(res){
      if(!res.ok){ o.innerHTML="<div class='load'>lookup denied: "+esc(res.body.error||res.status)+"</div>"; return; }
      var d=res.body, reg=d.registry||{}, host=d.host||{}, others=d.otherDomains||[], subs=d.subdomains||[], html="";
      function r(k,v){ return v?("<div class='r'><span class='k'>"+k+"</span><span class='v'>"+esc(v)+"</span></div>"):""; }
      function sect(t){ return "<div class='t'>"+t+"</div>"; }
      // Registry / ownership
      html += sect("Registry");
      html += r("Owner", reg.owner); html += r("Block", reg.netRange);
      html += r("Type", reg.type); html += r("Registered", reg.registered); html += r("Updated", reg.updated); html += r("Abuse", reg.abuse);
      // Host services
      if((host.ports&&host.ports.length)||(host.vulns&&host.vulns.length)){
        html += sect("Host");
        html += r("Open ports", (host.ports||[]).join(", "));
        if(host.vulns&&host.vulns.length) html += r("Vulns", host.vulns.slice(0,8).join(", "));
        if(host.hostnames&&host.hostnames.length) html += r("Hostnames", host.hostnames.slice(0,4).join(", "));
      }
      // Other domains on this IP
      if(others.length){ html += sect("Other domains on this IP ("+others.length+")");
        html += "<div class='r'><span class='v'>"+others.slice(0,10).map(esc).join("<br>")+(others.length>10?"<br>…":"")+"</span></div>"; }
      // Subdomains from cert transparency
      if(subs.length){ html += sect("Subdomains ("+subs.length+")");
        html += "<div class='r'><span class='v'>"+subs.slice(0,10).map(esc).join("<br>")+(subs.length>10?"<br>…":"")+"</span></div>"; }
      o.innerHTML = html || "<div class='load'>no OSINT records found</div>";
    }).catch(function(e){ o.innerHTML="<div class='load'>lookup failed</div>"; });
  }

  // ── sidecar calls ─────────────────────────────────────────────────
  function post(path,body){ return fetch(BASE+path,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body||{})}).then(function(r){return r.json().then(function(j){return {ok:r.ok,status:r.status,body:j};});}); }
  function gesture(x){ return Object.assign({actor:"user",userGesture:true},x||{}); }
  function setRule(domain,decision){ post("/firewall",gesture({domain:domain,decision:decision,approvalToken:"action:firewall-set"})).then(function(res){ if(res.ok){ var n=nodes.get(domain); if(n){ n.blocked=(decision==="block"); if(selected===n){ $("dBlock").className="block"+(n.blocked?" on":""); $("dBlock").textContent=n.blocked?"Unblock":"Block"; } } refreshCounts(); } }); }

  // ── toggles ───────────────────────────────────────────────────────
  Array.prototype.forEach.call(document.querySelectorAll("#viewSeg button"),function(b){ b.onclick=function(){
    Array.prototype.forEach.call(document.querySelectorAll("#viewSeg button"),function(x){x.classList.remove("on");}); b.classList.add("on"); view=b.getAttribute("data-view"); hideDetail(); }; });
  Array.prototype.forEach.call(document.querySelectorAll("#scopeSeg button"),function(b){ b.onclick=function(){
    Array.prototype.forEach.call(document.querySelectorAll("#scopeSeg button"),function(x){x.classList.remove("on");}); b.classList.add("on");
    nodes.clear(); conns.clear(); selected=null; hideDetail(); refreshCounts(); post("/scope",{scope:b.getAttribute("data-scope")}); }; });

  // ── capture strip (honest state + real Enable) ────────────────────
  function refreshCapture(){ fetch(BASE+"/capture/status").then(function(r){return r.json();}).then(function(s){ var cs=$("capStat"),btn=$("capBtn");
    if(s.running){ cs.textContent="● capturing ("+(s.engine||"")+")"; btn.textContent="Stop"; btn.disabled=false; btn.onclick=function(){ post("/capture/stop",gesture({approvalToken:"action:capture-stop"})).then(refreshCapture); }; }
    else if(s.canCapture){ cs.textContent="packet capture ready ("+(s.engine||"")+")"; btn.textContent="Capture"; btn.disabled=false; btn.onclick=function(){ post("/capture/start",gesture({approvalToken:"action:capture-start"})).then(function(res){ if(!res.ok) cs.textContent="denied: "+(res.body.error||res.status); refreshCapture(); }); }; }
    else if(s.available){ cs.textContent="raw pcap needs permission (one-time)"; btn.textContent="Enable"; btn.disabled=false; btn.onclick=function(){ cs.textContent="requesting admin…"; post("/capture/enable",gesture({approvalToken:"action:capture-enable"})).then(function(res){ cs.textContent=res.ok?(res.body.instructions||"enabling…"):("enable failed: "+(res.body.error||res.status)); setTimeout(refreshCapture,1500); }); }; }
    else { cs.textContent="install Wireshark for raw pcap (the map above needs nothing)"; btn.textContent="Capture"; btn.disabled=true; }
  }).catch(function(){ $("capStat").textContent="capture offline"; }); }

  // ── boot ──────────────────────────────────────────────────────────
  function loadSnapshot(){ fetch(BASE+"/map").then(function(r){return r.json();}).then(function(d){ (d.connections||[]).forEach(addConn); }); }
  function setDot(c,l){ $("dot").className="dot "+c; $("stat").textContent=l; }
  function connectWS(){ var ws; try{ ws=new WebSocket(WS); }catch(e){ setDot("err","stream error"); return; }
    ws.onopen=function(){ setDot("live","live"); }; ws.onclose=function(){ setDot("","reconnecting…"); setTimeout(connectWS,2000); }; ws.onerror=function(){ setDot("err","stream error"); };
    ws.onmessage=function(ev){ var m; try{m=JSON.parse(ev.data);}catch(e){return;} if(m.kind==="connection") addConn(m); else if(m.kind==="connection-closed") closeConn(m.key); };
  }
  (function applyInitial(){
    if (view === "map") { Array.prototype.forEach.call(document.querySelectorAll("#viewSeg button"), function(b){ b.classList.toggle("on", b.getAttribute("data-view")==="map"); }); }
    if (_initialScope === "system") {
      Array.prototype.forEach.call(document.querySelectorAll("#scopeSeg button"), function(b){ b.classList.toggle("on", b.getAttribute("data-scope")==="system"); });
      post("/scope", { scope: "system" });
    }
  })();
  // BearTrap honeypot — surface fingerprinting attempts the actor caught.
  function refreshHoneypot(){ fetch(BASE+"/honeypot").then(function(r){return r.json();}).then(function(d){
    var dets=d.detections||[], origins={}, exfil={};
    dets.forEach(function(x){ if(x.kind==="fingerprint") origins[x.origin]=x; else if(x.kind==="exfil") exfil[(x.origin||"")+"→"+(x.dest||"")]=x; });
    var n=Object.keys(origins).length, xn=Object.keys(exfil).length;
    $("cHoney").textContent=n; $("hpWrap").style.display = n?"inline":"none";
    $("hpWrap").title = n? ("Fingerprinting attempts:\n"+Object.keys(origins).map(function(o){return "• "+o.replace(/^https?:\/\//,"")+" ("+(origins[o].surfaceCount)+" surfaces)";}).join("\n")) : "";
    $("cXfil").textContent=xn; $("xfWrap").style.display = xn?"inline":"none";
    $("xfWrap").title = xn? ("Blocked exfiltration (canary leak):\n"+Object.values(exfil).map(function(x){return "• "+(x.origin||"").replace(/^https?:\/\//,"")+" → "+(x.dest||"");}).join("\n")) : "";
  }).catch(function(){}); }
  loadSnapshot(); connectWS(); refreshCapture(); refreshHoneypot();
  setInterval(refreshCapture,5000); setInterval(refreshHoneypot,4000);
})();
</script>
