<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- BearBrowser start page — ported from the native macOS shell's landing page
     (native/macos/BearBrowser-start.html) into the Gecko build. Packaged into
     browser omni.ja via browser/bearstart/ (see scripts/bearbrowser-patches.py)
     and served as the new-tab + home page at
     resource:///bearstart/bearbrowser-start.html. Fonts are self-hosted
     (DM Sans variable, same dir) so the page renders identically on
     Linux / Windows / macOS with zero network fetches. -->
<meta name="bearbrowser-bootstrap" content="BearBrowser start page active">
<title>BearBrowser</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* DM Sans variable font, self-hosted from this directory (no network). */
@font-face {
  font-family: 'DM Sans';
  font-style: normal;
  font-weight: 300 700;
  font-display: swap;
  src: url(dm-sans-latin.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'DM Sans';
  font-style: normal;
  font-weight: 300 700;
  font-display: swap;
  src: url(dm-sans-latin-ext.woff2) format('woff2');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
}

:root {
  --bg:        #f0f2f4;
  --surface:   #ffffff;
  --border:    rgba(0,0,0,.08);
  --text:      #1d1d1f;
  --muted:     #6e6e73;
  --accent:    #1b6b45;
  --chip-bg:   rgba(27,107,69,.10);
  --chip-text: #1b6b45;
  --shadow:    0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:        #1c1c1e;
    --surface:   #2c2c2e;
    --border:    rgba(255,255,255,.08);
    --text:      #f5f5f7;
    --muted:     #98989d;
    --accent:    #45c87a;
    --chip-bg:   rgba(69,200,122,.12);
    --chip-text: #45c87a;
    --shadow:    0 1px 3px rgba(0,0,0,.3), 0 4px 20px rgba(0,0,0,.2);
  }
}

html, body {
  height: 100%;
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 32px 24px 48px;
}

.wordmark {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 44px;
}
.wordmark-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
.wordmark-text {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.3px;
}

.pills {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: 36px;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 20px;
  background: var(--chip-bg);
  color: var(--chip-text);
  font-size: 12px;
  font-weight: 500;
}
.pill-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 80px);
  gap: 20px;
  margin-bottom: 44px;
}
.shortcut {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  text-decoration: none;
}
.shortcut-icon {
  width: 56px; height: 56px;
  border-radius: 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  transition: transform .12s ease, box-shadow .12s ease;
}
.shortcut:hover .shortcut-icon {
  transform: translateY(-2px);
  box-shadow: 0 4px 14px rgba(0,0,0,.10), 0 10px 32px rgba(0,0,0,.08);
}
.shortcut-label {
  font-size: 11px;
  color: var(--muted);
  text-align: center;
  white-space: nowrap;
}

.search-form {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  max-width: 520px;
  padding: 10px 16px;
  margin-bottom: 36px;
  border-radius: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  transition: box-shadow .15s ease, border-color .15s ease;
}
.search-form:focus-within {
  box-shadow: 0 0 0 3px rgba(69,200,122,.25), 0 2px 8px rgba(0,0,0,.12);
  border-color: var(--accent);
}
.search-form-icon { font-size: 15px; opacity: .45; flex-shrink: 0; }
.search-form input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  font-size: 15px;
  font-family: inherit;
  color: var(--text);
  padding: 0;
}
.search-form input::placeholder { color: var(--muted); }
.search-form-hint { font-size: 11px; color: var(--muted); opacity: .5; flex-shrink: 0; }

.footer {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--muted);
}
.status-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent);
}

/* Cockpit search surface — sovereign federated results rendered inline. */
.results {
  width: 100%;
  max-width: 640px;
  margin: -18px 0 30px;
  display: none;
  flex-direction: column;
  gap: 2px;
}
.results.show { display: flex; }
.result-receipt {
  font-size: 11px;
  color: var(--muted);
  padding: 4px 4px 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.result-receipt .status-dot { background: var(--accent); }
.result {
  display: block;
  text-decoration: none;
  color: inherit;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid transparent;
  transition: background .12s ease, border-color .12s ease;
}
.result:hover { background: var(--surface); border-color: var(--border); }
.result-title { font-size: 14px; color: var(--accent); margin-bottom: 2px; }
.result-url { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.result-snippet { font-size: 12.5px; color: var(--text); opacity: .85; margin-top: 3px; line-height: 1.45; }
.result-engine {
  display: inline-block; font-size: 10px; color: var(--chip-text);
  background: var(--chip-bg); border-radius: 6px; padding: 1px 6px; margin-left: 6px; vertical-align: middle;
}
.result-empty { font-size: 13px; color: var(--muted); padding: 8px 4px; }
</style>
</head>
<body>

<div class="wordmark">
  <div class="wordmark-icon">🐻</div>
  <span class="wordmark-text">BearBrowser</span>
</div>

<div class="pills">
  <span class="pill"><span class="pill-dot"></span>Provenance active</span>
  <span class="pill"><span class="pill-dot"></span>Policy governed</span>
  <span class="pill"><span class="pill-dot"></span>No Google telemetry</span>
  <span class="pill"><span class="pill-dot"></span>Fingerprint shield</span>
</div>

<form class="search-form" id="searchForm">
  <span class="search-form-icon">🔍</span>
  <input type="text" id="searchInput" placeholder="Search the sovereign web, or enter an address" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  <span class="search-form-hint">⏎</span>
</form>

<div class="results" id="results"></div>

<div class="grid">
  <a class="shortcut" href="https://studio.socioprophet.ai">
    <div class="shortcut-icon">🛰️</div>
    <span class="shortcut-label">Studio</span>
  </a>
  <a class="shortcut" href="https://app.socioprophet.ai">
    <div class="shortcut-icon">🧭</div>
    <span class="shortcut-label">Cockpit</span>
  </a>
  <a class="shortcut" href="https://code.socioprophet.ai">
    <div class="shortcut-icon">🐙</div>
    <span class="shortcut-label">Code</span>
  </a>
  <a class="shortcut" href="https://registry.socioprophet.ai">
    <div class="shortcut-icon">📦</div>
    <span class="shortcut-label">Registry</span>
  </a>
</div>

<div class="footer">
  <span class="status-dot"></span>
  <span id="footerText">Sovereign search · governed &amp; provenance-logged · no Google</span>
</div>

<script>
(function () {
  // ── Sovereign search config ────────────────────────────────────────────────
  // Federated JSON API (renders results inline in this cockpit). Falls back to the
  // sovereign SearXNG HTML surface if the API can't be reached (e.g. CORS not yet
  // enabled or offline). No Google/DDG default — sovereign endpoints only.
  var SEARCH_API = "https://search-api.socioprophet.ai/search?q=";   // JSON
  var SEARCH_HTML = "https://searx.socioprophet.ai/search?q=";        // sovereign HTML fallback

  var form = document.getElementById("searchForm");
  var input = document.getElementById("searchInput");
  var results = document.getElementById("results");

  function looksLikeUrl(q) {
    if (/\s/.test(q)) return false;
    return /^[a-z]+:\/\//i.test(q) || /^[\w-]+(\.[\w-]+)+(:\d+)?(\/|$)/.test(q);
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function render(query, data) {
    var list = (data && data.results) || [];
    var html = '<div class="result-receipt"><span class="status-dot"></span>' +
      "federated · " + list.length + " result" + (list.length === 1 ? "" : "s") +
      " · via search-api.socioprophet.ai</div>";
    if (!list.length) {
      html += '<div class="result-empty">No sovereign results. Press ⏎ again to open the full search surface.</div>';
    } else {
      list.forEach(function (r) {
        html += '<a class="result" href="' + esc(r.url) + '">' +
          '<div class="result-title">' + esc(r.title) +
          (r.engine ? '<span class="result-engine">' + esc(r.engine) + "</span>" : "") + "</div>" +
          '<div class="result-url">' + esc(r.url) + "</div>" +
          (r.snippet ? '<div class="result-snippet">' + esc(r.snippet) + "</div>" : "") +
          "</a>";
      });
    }
    results.innerHTML = html;
    results.classList.add("show");
  }
  function fallbackHtml(q) { location.href = SEARCH_HTML + encodeURIComponent(q); }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var q = input.value.trim();
    if (!q) return;
    if (looksLikeUrl(q)) {
      location.href = /^[a-z]+:\/\//i.test(q) ? q : "https://" + q;
      return;
    }
    results.classList.remove("show");
    fetch(SEARCH_API + encodeURIComponent(q), { headers: { accept: "application/json" } })
      .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
      .then(function (data) { render(q, data); })
      .catch(function () { fallbackHtml(q); });   // CORS/offline → sovereign HTML surface
  });
  input.focus();
})();
</script>

</body>
</html>
