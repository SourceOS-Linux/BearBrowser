apiVersion: sourceos.dev/v1alpha1
kind: CredentialBrokerContract
metadata:
  name: bearbrowser-credential-broker
  labels:
    sourceos.dev/product: BearBrowser
spec:
  defaultDecision: deny
  storageModel:
    browserOwnedPasswordVault: disabledByDefault
    browserOwnedPaymentVault: disabledByDefault
    osNativeCredentialBroker: preferred
  humanSecure:
    credentialSources:
      macOS:
        - KeychainServices
        - LocalAuthentication
        - PlatformPasskeys
      linux:
        - SecretService
        - GNOMEKeyring
        - KWallet
        - libsecret
        - FIDO2
        - PlatformPasskeys
    biometricUnlock:
      mediatedByOS: true
      browserHandlesBiometricSecrets: false
      resultSurface: allowDenyOnly
    payments:
      browserOwnedStorage: disabledByDefault
      providerOrOSMediated: true
    autofill:
      userMediated: true
      policyMediated: true
  agentRuntime:
    inheritHumanCredentials: false
    credentialSources:
      - PolicyBrokerSessionCredential
    credentialPersistence: sessionScoped
    credentialExport: denied
    requirePolicyDecisionId: true
    requireCredentialBoundaryEvents: true
    payments:
      allowed: false
    autofill:
      allowed: false
  requiredEvents:
    - browser.credential.boundary
    - browser.credential.requested
    - browser.credential.granted
    - browser.credential.denied
    - browser.credential.cleared
  redaction:
    eventPayloadSecrets: forbidden
    showSecretValuesInWorkspace: false
