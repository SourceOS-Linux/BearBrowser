apiVersion: sourceos.dev/v1alpha1
kind: BrowserPolicyContract
metadata:
  name: bearbrowser
  labels:
    sourceos.dev/product: BearBrowser
    sourceos.dev/runtime: browser
spec:
  defaultMode: humanSecure
  defaultDecision: deny
  modes:
    humanSecure:
      description: Privacy-first human browser profile derived from LibreWolf with SourceOS workspace integration.
      profilePersistence: persistent
      automation: disabledByDefault
      downloads:
        governed: true
        mountClass: user-downloads
        defaultDecision: allowWithinWorkspace
        requireProvenanceEvent: true
      captures:
        screenshots: userInitiatedOnly
        domSnapshots: disabledByDefault
        provenanceLog: optional
      network:
        policyRequired: true
        defaultDecision: allowPublicWeb
        denyPrivateNetworkByDefault: false
        requireEgressAttribution: true
      filesystem:
        policyRequired: true
        defaultDecision: denyHostFilesystem
        allowedMountClasses:
          - user-downloads
          - workspace-documents
      credentials:
        sharedWithAgents: false
        source: humanProfileOnly
        export: denied
      nativeMessaging:
        defaultDecision: deny
        allowlistRequired: true
      clipboard:
        defaultDecision: userMediated
      mediaDevices:
        camera: userMediated
        microphone: userMediated
        screenShare: userMediated
    agentRuntime:
      description: Governed browser execution surface for local, cloud, and fog agents.
      profilePersistence: ephemeralByDefault
      automation: policyMediated
      defaultDecision: deny
      session:
        requireSessionId: true
        requireAgentId: true
        requireWorkspaceId: true
        maxDefaultTtlMinutes: 120
        cleanupOnExit: true
      downloads:
        governed: true
        mountClass: agent-downloads
        defaultDecision: denyOutsideMount
        requireProvenanceEvent: true
        requireContentHash: true
      captures:
        screenshots: policyMediated
        domSnapshots: policyMediated
        pdfExports: policyMediated
        provenanceLog: required
        defaultDecision: denyUnlessGranted
      network:
        policyRequired: true
        defaultDecision: denyUnlessGranted
        denyPrivateNetworkByDefault: true
        denyLoopbackByDefault: true
        denyMetadataServices: true
        requireEgressAttribution: true
        allowedByPolicy:
          - publicWeb
          - explicitDomainAllowlist
          - workspaceApprovedEndpoints
      filesystem:
        policyRequired: true
        defaultDecision: denyHostFilesystem
        noAmbientHomeAccess: true
        noAmbientSshAccess: true
        noAmbientCloudCredentialAccess: true
        allowedMountClasses:
          - agent-downloads
          - agent-uploads
          - agent-profile
          - agent-captures
          - agent-cache
          - workspace-input-readonly
      credentials:
        sharedWithHumanProfile: false
        sharedWithAgents: false
        source: policyBrokerOnly
        export: denied
        persistence: sessionScoped
        requireCredentialBoundaryEvents: true
      nativeMessaging:
        defaultDecision: deny
        allowlistRequired: true
        allowedHosts: []
      extensions:
        defaultDecision: deny
        install: policyMediated
        allowlistRequired: true
      clipboard:
        defaultDecision: deny
        policyMediated: true
      mediaDevices:
        camera: denied
        microphone: denied
        screenShare: policyMediated
      devtools:
        defaultDecision: policyMediated
        remoteDebugging:
          defaultDecision: deny
          bindAddress: 127.0.0.1
          requireEphemeralPort: true
          requireSessionToken: true
  # ---------------------------------------------------------------------------
  # agentActionContract — the enforcing action→class map consumed by
  # scripts/agent-control-bridge.py. This is the machine-readable form of the
  # mapping table in docs/agent-control-bridge.md §3. Every agent action the
  # control bridge is asked to perform is classified here BEFORE execution:
  #   allowed     → permit, attest a browser.<action> ReasoningEvent
  #   gated       → permit ONLY with a valid per-action approval token, else DENY
  #   prohibited  → DENY unconditionally (no approval path), attest a violation
  # policyConditions re-classify an action based on planner-supplied params
  # (e.g. a click the planner flags as a form submission → gated; a fill into a
  # credential/payment/gov-id field → prohibited). This is the containment
  # Gartner demands: the rogue/injected action is blocked at decision time.
  # ---------------------------------------------------------------------------
  agentActionContract:
    policyRef: urn:srcos:policy:bearbrowser-agent-runtime
    defaultDecision: deny       # any action not classified below is denied
    actionClasses:
      allowed:
        - action: navigate
          replayClass: exact
          eventType: browser.navigate
        - action: read-dom
          replayClass: exact
          eventType: browser.read-dom
        - action: query-selector
          replayClass: exact
          eventType: browser.query-selector
        - action: extract-text
          replayClass: exact
          eventType: browser.extract-text
        - action: screenshot
          replayClass: best-effort
          eventType: browser.screenshot
        - action: scroll
          replayClass: exact
          eventType: browser.scroll
        - action: wait
          replayClass: exact
          eventType: browser.wait
        - action: click
          replayClass: best-effort
          eventType: browser.click
        - action: fill-form-field
          replayClass: best-effort
          eventType: browser.fill-form-field
      gated:
        - action: submit-form
          replayClass: non-replayable-side-effect
          eventType: browser.submit-form
        - action: file-download
          replayClass: non-replayable-side-effect
          eventType: browser.file-download
        - action: oauth-grant
          replayClass: non-replayable-side-effect
          eventType: browser.oauth-grant
        - action: payment-autofill
          replayClass: non-replayable-side-effect
          eventType: browser.payment-autofill
        - action: cross-origin-post
          replayClass: non-replayable-side-effect
          eventType: browser.cross-origin-post
        - action: clipboard-write
          replayClass: non-replayable-side-effect
          eventType: browser.clipboard-write
        - action: geolocation
          replayClass: evidence-only
          eventType: browser.geolocation
        - action: camera-mic
          replayClass: evidence-only
          eventType: browser.camera-mic
      prohibited:
        - action: enter-credentials
          eventType: browser.policy.violation
        - action: enter-payment-details
          eventType: browser.policy.violation
        - action: enter-government-id
          eventType: browser.policy.violation
        - action: modify-access-controls
          eventType: browser.policy.violation
        - action: bypass-captcha
          eventType: browser.policy.violation
        - action: execute-trade-or-transfer
          eventType: browser.policy.violation
    # policyConditions re-classify a base action when planner-supplied params
    # match. Evaluated in order; the FIRST match wins. `reclassifyTo` is the
    # resulting class. The `when` block is a minimal jsonlogic-style predicate
    # (a single operator over an action param) the bridge evaluates locally.
    policyConditions:
      - id: click-is-form-submission
        description: A click the planner flagged as submitting a form is a gated submit-form.
        appliesTo: click
        when: { "==": [ { "var": "intent" }, "submit-form" ] }
        reclassifyTo: gated
        as: submit-form
      - id: click-is-payment
        description: A click the planner flagged as placing an order/trade is prohibited.
        appliesTo: click
        when: { "==": [ { "var": "intent" }, "execute-trade" ] }
        reclassifyTo: prohibited
        as: execute-trade-or-transfer
      - id: fill-into-credential-field
        description: A fill into a password/credential field is prohibited credential entry.
        appliesTo: fill-form-field
        when: { "in": [ { "var": "fieldType" }, [ "password", "credential", "username", "totp" ] ] }
        reclassifyTo: prohibited
        as: enter-credentials
      - id: fill-into-payment-field
        description: A fill into a card/cvv/payment field is prohibited payment entry.
        appliesTo: fill-form-field
        when: { "in": [ { "var": "fieldType" }, [ "card", "cardNumber", "cvv", "pan", "payment" ] ] }
        reclassifyTo: prohibited
        as: enter-payment-details
      - id: fill-into-govid-field
        description: A fill into an SSN/passport/gov-id field is prohibited gov-id entry.
        appliesTo: fill-form-field
        when: { "in": [ { "var": "fieldType" }, [ "ssn", "passport", "govId", "nationalId" ] ] }
        reclassifyTo: prohibited
        as: enter-government-id
  audit:
    requiredEvents:
      - browser.session.started
      - browser.session.ended
      - browser.navigation.requested
      - browser.navigation.completed
      - browser.download.created
      - browser.capture.created
      - browser.policy.violation
      - browser.credential.boundary
    eventSink: AgentPlane
    policyDecisionSink: PolicyFabric
    workspaceVisibilitySink: ProphetWorkspace
  workspaceOperations:
    required: true
    operationContract: agentplane/workspace-operation-plane.yaml
    requiredTypes:
      - browser.session.start
      - browser.capture.create
      - browser.download.create
      - browser.upload.create
      - browser.automation.run
      - browser.diagnostics.export_redacted
    operationEventLifecycle:
      - start
      - progress
      - failure
      - retry
      - cancel
      - complete
    policyAuthority: PolicyFabric
    policyMediatedTypes:
      - browser.capture.create
      - browser.download.create
      - browser.upload.create
      - browser.automation.run
      - browser.diagnostics.export_redacted
