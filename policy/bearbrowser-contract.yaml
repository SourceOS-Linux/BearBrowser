apiVersion: sourceos.dev/v1alpha1
kind: BrowserPolicyContract
metadata:
  name: bearbrowser
  labels:
    sourceos.dev/product: BearBrowser
    sourceos.dev/runtime: browser
spec:
  defaultMode: humanSecure
  defaultDecision: deny
  modes:
    humanSecure:
      description: Privacy-first human browser profile derived from LibreWolf with SourceOS workspace integration.
      profilePersistence: persistent
      automation: disabledByDefault
      downloads:
        governed: true
        mountClass: user-downloads
        defaultDecision: allowWithinWorkspace
        requireProvenanceEvent: true
      captures:
        screenshots: userInitiatedOnly
        domSnapshots: disabledByDefault
        provenanceLog: optional
      network:
        policyRequired: true
        defaultDecision: allowPublicWeb
        denyPrivateNetworkByDefault: false
        requireEgressAttribution: true
      filesystem:
        policyRequired: true
        defaultDecision: denyHostFilesystem
        allowedMountClasses:
          - user-downloads
          - workspace-documents
      credentials:
        sharedWithAgents: false
        source: humanProfileOnly
        export: denied
      nativeMessaging:
        defaultDecision: deny
        allowlistRequired: true
      clipboard:
        defaultDecision: userMediated
      mediaDevices:
        camera: userMediated
        microphone: userMediated
        screenShare: userMediated
    agentRuntime:
      description: Governed browser execution surface for local, cloud, and fog agents.
      profilePersistence: ephemeralByDefault
      automation: policyMediated
      defaultDecision: deny
      session:
        requireSessionId: true
        requireAgentId: true
        requireWorkspaceId: true
        maxDefaultTtlMinutes: 120
        cleanupOnExit: true
      downloads:
        governed: true
        mountClass: agent-downloads
        defaultDecision: denyOutsideMount
        requireProvenanceEvent: true
        requireContentHash: true
      captures:
        screenshots: policyMediated
        domSnapshots: policyMediated
        pdfExports: policyMediated
        provenanceLog: required
        defaultDecision: denyUnlessGranted
      network:
        policyRequired: true
        defaultDecision: denyUnlessGranted
        denyPrivateNetworkByDefault: true
        denyLoopbackByDefault: true
        denyMetadataServices: true
        requireEgressAttribution: true
        allowedByPolicy:
          - publicWeb
          - explicitDomainAllowlist
          - workspaceApprovedEndpoints
      filesystem:
        policyRequired: true
        defaultDecision: denyHostFilesystem
        noAmbientHomeAccess: true
        noAmbientSshAccess: true
        noAmbientCloudCredentialAccess: true
        allowedMountClasses:
          - agent-downloads
          - agent-uploads
          - agent-profile
          - agent-captures
          - agent-cache
          - workspace-input-readonly
      credentials:
        sharedWithHumanProfile: false
        sharedWithAgents: false
        source: policyBrokerOnly
        export: denied
        persistence: sessionScoped
        requireCredentialBoundaryEvents: true
      nativeMessaging:
        defaultDecision: deny
        allowlistRequired: true
        allowedHosts: []
      extensions:
        defaultDecision: deny
        install: policyMediated
        allowlistRequired: true
      clipboard:
        defaultDecision: deny
        policyMediated: true
      mediaDevices:
        camera: denied
        microphone: denied
        screenShare: policyMediated
      devtools:
        defaultDecision: policyMediated
        remoteDebugging:
          defaultDecision: deny
          bindAddress: 127.0.0.1
          requireEphemeralPort: true
          requireSessionToken: true
  # ---------------------------------------------------------------------------
  # agentActionContract — the enforcing action→class map consumed by
  # scripts/agent-control-bridge.py. This is the machine-readable form of the
  # mapping table in docs/agent-control-bridge.md §3. Every agent action the
  # control bridge is asked to perform is classified here BEFORE execution:
  #   allowed     → permit, attest a browser.<action> ReasoningEvent
  #   gated       → permit ONLY with a valid per-action approval token, else DENY
  #   prohibited  → DENY unconditionally (no approval path), attest a violation
  # policyConditions re-classify an action based on planner-supplied params
  # (e.g. a click the planner flags as a form submission → gated; a fill into a
  # credential/payment/gov-id field → prohibited). This is the containment
  # Gartner demands: the rogue/injected action is blocked at decision time.
  #
  # NOTE: this block was dropped by an earlier "Harden BearBrowser policy
  # contract" rewrite, which reddened test_injection_containment.py (the bridge
  # fell closed on every action). Restored here; do not remove without moving
  # the action→class map somewhere the bridge's Policy loader reads.
  # ---------------------------------------------------------------------------
  agentActionContract:
    policyRef: urn:srcos:policy:bearbrowser-agent-runtime
    defaultDecision: deny       # any action not classified below is denied
    actionClasses:
      allowed:
        - action: navigate
          replayClass: exact
          eventType: browser.navigate
        - action: read-dom
          replayClass: exact
          eventType: browser.read-dom
        - action: query-selector
          replayClass: exact
          eventType: browser.query-selector
        - action: extract-text
          replayClass: exact
          eventType: browser.extract-text
        - action: screenshot
          replayClass: best-effort
          eventType: browser.screenshot
        - action: scroll
          replayClass: exact
          eventType: browser.scroll
        - action: wait
          replayClass: exact
          eventType: browser.wait
        - action: click
          replayClass: best-effort
          eventType: browser.click
        - action: fill-form-field
          replayClass: best-effort
          eventType: browser.fill-form-field
      gated:
        - action: submit-form
          replayClass: non-replayable-side-effect
          eventType: browser.submit-form
        - action: file-download
          replayClass: non-replayable-side-effect
          eventType: browser.file-download
        - action: oauth-grant
          replayClass: non-replayable-side-effect
          eventType: browser.oauth-grant
        - action: payment-autofill
          replayClass: non-replayable-side-effect
          eventType: browser.payment-autofill
        - action: cross-origin-post
          replayClass: non-replayable-side-effect
          eventType: browser.cross-origin-post
        - action: clipboard-write
          replayClass: non-replayable-side-effect
          eventType: browser.clipboard-write
        - action: geolocation
          replayClass: evidence-only
          eventType: browser.geolocation
        - action: camera-mic
          replayClass: evidence-only
          eventType: browser.camera-mic
      prohibited:
        - action: enter-credentials
          eventType: browser.policy.violation
        - action: enter-payment-details
          eventType: browser.policy.violation
        - action: enter-government-id
          eventType: browser.policy.violation
        - action: modify-access-controls
          eventType: browser.policy.violation
        - action: bypass-captcha
          eventType: browser.policy.violation
        - action: execute-trade-or-transfer
          eventType: browser.policy.violation
    # policyConditions re-classify a base action when planner-supplied params
    # match. Evaluated in order; the FIRST match wins. `reclassifyTo` is the
    # resulting class. The `when` block is a minimal jsonlogic-style predicate
    # (a single operator over an action param) the bridge evaluates locally.
    policyConditions:
      - id: click-is-form-submission
        description: A click the planner flagged as submitting a form is a gated submit-form.
        appliesTo: click
        when: { "==": [ { "var": "intent" }, "submit-form" ] }
        reclassifyTo: gated
        as: submit-form
      - id: click-is-payment
        description: A click the planner flagged as placing an order/trade is prohibited.
        appliesTo: click
        when: { "==": [ { "var": "intent" }, "execute-trade" ] }
        reclassifyTo: prohibited
        as: execute-trade-or-transfer
      - id: fill-into-credential-field
        description: A fill into a password/credential field is prohibited credential entry.
        appliesTo: fill-form-field
        when: { "in": [ { "var": "fieldType" }, [ "password", "credential", "username", "totp" ] ] }
        reclassifyTo: prohibited
        as: enter-credentials
      - id: fill-into-payment-field
        description: A fill into a card/cvv/payment field is prohibited payment entry.
        appliesTo: fill-form-field
        when: { "in": [ { "var": "fieldType" }, [ "card", "cardNumber", "cvv", "pan", "payment" ] ] }
        reclassifyTo: prohibited
        as: enter-payment-details
      - id: fill-into-govid-field
        description: A fill into an SSN/passport/gov-id field is prohibited gov-id entry.
        appliesTo: fill-form-field
        when: { "in": [ { "var": "fieldType" }, [ "ssn", "passport", "govId", "nationalId" ] ] }
        reclassifyTo: prohibited
        as: enter-government-id
  # ---------------------------------------------------------------------------
  # iotActionContract — the SAME enforcing action→class model, applied to the
  # physical world. The BearBrowser cockpit (chrome://bearbrowser) is the
  # sovereign control plane for the user's smart-home / IoT estate; the
  # iot-sidecar drives devices, and EVERY command is classified here BEFORE it
  # reaches a device — by the same Policy engine that governs browser actions
  # (agent-control-bridge.py --surface iot). Emits iot.<action> ReasoningEvents
  # into the same evidence fabric; a prohibited (or injected) physical action is
  # blocked at decision time, never merely logged after.
  #   allowed     → read-only queries with no physical effect
  #   gated       → reversible physical effect, needs a per-action approval token
  #   prohibited  → safety/security-critical; DENIED unless a policyCondition
  #                 proves an explicit user gesture from the cockpit (never an
  #                 agent). An agent-originated unlock-door never matches → denied.
  # ---------------------------------------------------------------------------
  iotActionContract:
    policyRef: urn:srcos:policy:bearbrowser-iot
    defaultDecision: deny
    actionClasses:
      allowed:
        - action: list-devices
          replayClass: exact
          eventType: iot.list-devices
        - action: read-state
          replayClass: exact
          eventType: iot.read-state
        - action: get-capabilities
          replayClass: exact
          eventType: iot.get-capabilities
        - action: subscribe-events
          replayClass: exact
          eventType: iot.subscribe-events
        - action: query-history
          replayClass: exact
          eventType: iot.query-history
      gated:
        - action: toggle-power
          replayClass: non-replayable-side-effect
          eventType: iot.toggle-power
        - action: set-brightness
          replayClass: non-replayable-side-effect
          eventType: iot.set-brightness
        - action: set-color
          replayClass: non-replayable-side-effect
          eventType: iot.set-color
        - action: set-thermostat
          replayClass: non-replayable-side-effect
          eventType: iot.set-thermostat
        - action: set-fan
          replayClass: non-replayable-side-effect
          eventType: iot.set-fan
        - action: set-cover
          replayClass: non-replayable-side-effect
          eventType: iot.set-cover
        - action: set-scene
          replayClass: non-replayable-side-effect
          eventType: iot.set-scene
        - action: play-media
          replayClass: non-replayable-side-effect
          eventType: iot.play-media
        - action: set-volume
          replayClass: non-replayable-side-effect
          eventType: iot.set-volume
        - action: lock-door
          replayClass: non-replayable-side-effect
          eventType: iot.lock-door
        - action: arm-security
          replayClass: non-replayable-side-effect
          eventType: iot.arm-security
      # NOTE: eventType is the action's NATURAL name, not the violation string.
      # The bridge derives iot.policy.violation from the prohibited CLASS at
      # decision time. Storing the violation string here would mislabel the
      # receipt when a policyCondition reclassifies the action UP to gated on an
      # explicit user gesture (e.g. unlock-door → gated permit must attest
      # iot.unlock-door, not iot.policy.violation).
      prohibited:
        - action: unlock-door
          eventType: iot.unlock-door
        - action: disarm-security
          eventType: iot.disarm-security
        - action: open-garage-door
          eventType: iot.open-garage-door
        - action: disable-camera
          eventType: iot.disable-camera
        - action: disable-sensor
          eventType: iot.disable-sensor
        - action: pair-device
          eventType: iot.pair-device
        - action: add-user
          eventType: iot.add-user
        - action: factory-reset
          eventType: iot.factory-reset
        - action: firmware-update
          eventType: iot.firmware-update
    # An explicit, present-tense user gesture in the cockpit is the ONLY thing
    # that can reclassify a prohibited physical action down to gated (where it
    # still needs a per-action token). actor MUST be "user" AND userGesture MUST
    # be true — both are set by the cockpit UI on direct interaction and can
    # never be forged by an agent planner, so an injected/agent unlock-door
    # matches no condition and stays prohibited → denied unconditionally.
    policyConditions:
      - id: unlock-with-user-gesture
        description: A door unlock is permitted (as gated) only on an explicit cockpit user gesture.
        appliesTo: unlock-door
        when: { "and": [ { "==": [ { "var": "actor" }, "user" ] }, { "==": [ { "var": "userGesture" }, true ] } ] }
        reclassifyTo: gated
      - id: disarm-with-user-gesture
        description: Disarming security is permitted (as gated) only on an explicit cockpit user gesture.
        appliesTo: disarm-security
        when: { "and": [ { "==": [ { "var": "actor" }, "user" ] }, { "==": [ { "var": "userGesture" }, true ] } ] }
        reclassifyTo: gated
      - id: garage-with-user-gesture
        description: Opening the garage is permitted (as gated) only on an explicit cockpit user gesture.
        appliesTo: open-garage-door
        when: { "and": [ { "==": [ { "var": "actor" }, "user" ] }, { "==": [ { "var": "userGesture" }, true ] } ] }
        reclassifyTo: gated
      - id: scene-bundles-prohibited-action
        description: A scene/routine that bundles a security-critical action inherits prohibited.
        appliesTo: set-scene
        when: { "in": [ { "var": "includesAction" }, [ "unlock-door", "disarm-security", "open-garage-door", "disable-camera" ] ] }
        reclassifyTo: prohibited
        as: unlock-door
  # ---------------------------------------------------------------------------
  # captureActionContract — the SAME enforcing action→class model applied to the
  # network-visibility sidecar (capture-sidecar): session packet capture, the
  # live connection map, and the per-domain firewall. Read surfaces (status, map
  # snapshot, firewall list) are allowed. Starting a whole-session packet capture
  # and exporting the resulting pcap are the two EXFILTRATION vectors here, so
  # they are prohibited by default — no agent or injected planner can silently
  # record or export traffic — and reclassify to gated ONLY on an explicit,
  # present-tense cockpit user gesture (actor=user AND userGesture=true).
  # ---------------------------------------------------------------------------
  captureActionContract:
    policyRef: urn:srcos:policy:bearbrowser-capture
    defaultDecision: deny
    actionClasses:
      allowed:
        - action: capture-status
          replayClass: exact
          eventType: capture.capture-status
        - action: list-connections
          replayClass: exact
          eventType: capture.list-connections
        - action: list-firewall
          replayClass: exact
          eventType: capture.list-firewall
      gated:
        - action: capture-stop
          replayClass: non-replayable-side-effect
          eventType: capture.capture-stop
        - action: firewall-set
          replayClass: non-replayable-side-effect
          eventType: capture.firewall-set
      # eventType is the NATURAL action name; the bridge derives
      # capture.policy.violation from the prohibited CLASS at decision time, so a
      # gesture-permitted capture attests capture.capture-start (not the
      # violation string) — same rule as the iot contract above.
      prohibited:
        - action: capture-start
          eventType: capture.capture-start
        - action: capture-export
          eventType: capture.capture-export
    policyConditions:
      - id: capture-with-user-gesture
        description: Starting a packet capture is permitted (as gated) only on an explicit cockpit user gesture.
        appliesTo: capture-start
        when: { "and": [ { "==": [ { "var": "actor" }, "user" ] }, { "==": [ { "var": "userGesture" }, true ] } ] }
        reclassifyTo: gated
      - id: export-with-user-gesture
        description: Exporting a captured pcap is permitted (as gated) only on an explicit cockpit user gesture.
        appliesTo: capture-export
        when: { "and": [ { "==": [ { "var": "actor" }, "user" ] }, { "==": [ { "var": "userGesture" }, true ] } ] }
        reclassifyTo: gated
  # ---------------------------------------------------------------------------
  # agentMachineActionContract — the SAME enforcing action→class model applied to
  # the cockpit's local agent (the bundled Noetica agent-machine loopback sidecar,
  # 127.0.0.1). Lane 4 of docs/cockpit-composition-plan.md: the cockpit talks to
  # the governance gate (scripts/bearbrowser-agent-machine-gate.py), which
  # classifies every agent-machine action through THIS contract via
  # agent-control-bridge.py --surface agent-machine BEFORE forwarding it to the
  # sidecar — so the local agent is governed by the same engine as the browser and
  # the IoT estate. A prohibited (or prompt-injected) agent action is blocked at
  # decision time and attested (agent.policy.violation), never merely logged after.
  #   allowed     → read-only surfaces (graph/knowledge/status reads, no side effect)
  #   gated       → mutating/executing actions, need a per-action approval token
  #   prohibited  → host-reaching / destructive; denied unless a policyCondition
  #                 proves an explicit cockpit user gesture (unforgeable by the agent)
  # ---------------------------------------------------------------------------
  agentMachineActionContract:
    policyRef: urn:srcos:policy:bearbrowser-agent-machine
    defaultDecision: deny
    actionClasses:
      allowed:
        - action: read-graph
          replayClass: exact
          eventType: agent.read-graph
        - action: read-knowledge
          replayClass: exact
          eventType: agent.read-knowledge
        - action: query-status
          replayClass: exact
          eventType: agent.query-status
        - action: list-models
          replayClass: exact
          eventType: agent.list-models
        - action: chat-completion
          replayClass: evidence-only
          eventType: agent.chat-completion
      gated:
        - action: run-pipeline
          replayClass: non-replayable-side-effect
          eventType: agent.run-pipeline
        - action: write-knowledge
          replayClass: non-replayable-side-effect
          eventType: agent.write-knowledge
        - action: mutate-graph
          replayClass: non-replayable-side-effect
          eventType: agent.mutate-graph
        - action: devspace-command
          replayClass: non-replayable-side-effect
          eventType: agent.devspace-command
        - action: install-package
          replayClass: non-replayable-side-effect
          eventType: agent.install-package
        - action: network-fetch
          replayClass: non-replayable-side-effect
          eventType: agent.network-fetch
      prohibited:
        - action: execute-shell
          eventType: agent.execute-shell
        - action: read-host-filesystem
          eventType: agent.read-host-filesystem
        - action: write-host-filesystem
          eventType: agent.write-host-filesystem
        - action: read-credentials
          eventType: agent.read-credentials
        - action: disable-egress-guard
          eventType: agent.disable-egress-guard
        - action: disable-governance
          eventType: agent.disable-governance
    # A prohibited agent action is reclassified DOWN to gated ONLY on an explicit
    # cockpit user gesture (actor==user AND userGesture==true) — flags the cockpit
    # UI sets on direct interaction that the agent planner cannot forge. So an
    # agent/injected execute-shell matches no condition → stays prohibited → denied.
    policyConditions:
      - id: shell-with-user-gesture
        description: A shell command is permitted (as gated) only on an explicit cockpit user gesture.
        appliesTo: execute-shell
        when: { "and": [ { "==": [ { "var": "actor" }, "user" ] }, { "==": [ { "var": "userGesture" }, true ] } ] }
        reclassifyTo: gated
      - id: hostfs-write-with-user-gesture
        description: Writing the host filesystem is permitted (as gated) only on an explicit cockpit user gesture.
        appliesTo: write-host-filesystem
        when: { "and": [ { "==": [ { "var": "actor" }, "user" ] }, { "==": [ { "var": "userGesture" }, true ] } ] }
        reclassifyTo: gated
  audit:
    requiredEvents:
      - browser.session.started
      - browser.session.ended
      - browser.navigation.requested
      - browser.navigation.completed
      - browser.download.created
      - browser.capture.created
      - browser.policy.violation
      - browser.credential.boundary
    eventSink: AgentPlane
    policyDecisionSink: PolicyFabric
    workspaceVisibilitySink: ProphetWorkspace
  workspaceOperations:
    required: true
    operationContract: agentplane/workspace-operation-plane.yaml
    requiredTypes:
      - browser.session.start
      - browser.capture.create
      - browser.download.create
      - browser.upload.create
      - browser.automation.run
      - browser.diagnostics.export_redacted
    operationEventLifecycle:
      - start
      - progress
      - failure
      - retry
      - cancel
      - complete
    policyAuthority: PolicyFabric
    policyMediatedTypes:
      - browser.capture.create
      - browser.download.create
      - browser.upload.create
      - browser.automation.run
      - browser.diagnostics.export_redacted
