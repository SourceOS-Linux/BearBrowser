apiVersion: sourceos.dev/v1alpha1
kind: WorkspaceRedactionPolicy
metadata:
  name: bearbrowser-credential-redaction
  labels:
    sourceos.dev/product: BearBrowser
spec:
  showBackendName: true
  showDecisionOnly: true
  showSecretValues: false
  showCredentialIdentifiersByDefault: false
  showCredentialMaterial: false
  showPaymentValues: false
  showBiometricMaterial: false
  showTokenValues: false
  showCookieValues: false
  eventPayloadSecrets: forbidden
  allowedSummaries:
    - brokerBackend
    - decision
    - reason
    - policyDecisionId
    - credentialClass
    - credentialScope
    - timestamp
