apiVersion: sourceos.dev/v1alpha1
kind: WorkspaceSurface
metadata:
  name: bearbrowser
  labels:
    sourceos.dev/product: BearBrowser
spec:
  surfaceType: browser
  displayName: BearBrowser
  modes:
    - human-secure
    - agent-runtime
  stateModel:
    states:
      - idle
      - requested
      - policy-pending
      - starting
      - running
      - credential-pending
      - credential-denied
      - blocked
      - artifact-created
      - ending
      - ended
      - failed
    defaultState: idle
  visibleFields:
    - sessionId
    - agentId
    - workspaceId
    - profileMode
    - automationSurface
    - currentUrl
    - policyStatus
    - credentialBrokerStatus
    - credentialBoundaryState
    - artifactCount
    - lastEventAt
  workspaceEvents:
    - browser.session.started
    - browser.session.ended
    - browser.navigation.requested
    - browser.navigation.completed
    - browser.download.created
    - browser.capture.created
    - browser.policy.violation
    - browser.credential.boundary
    - browser.credential.requested
    - browser.credential.granted
    - browser.credential.denied
    - browser.credential.cleared
  userActions:
    - openSessionDetails
    - viewArtifacts
    - viewPolicyDecision
    - viewCredentialBoundarySummary
    - requestSessionEnd
    - exportProvenanceSummary
  redaction:
    hideCredentials: true
    hideCookieValues: true
    hideLocalStorageValues: true
    showArtifactMetadataOnlyByDefault: true
