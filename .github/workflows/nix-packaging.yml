name: BearBrowser Nix packaging

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  nix-packaging-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BearBrowser
        uses: actions/checkout@v4

      - name: Verify Nix packaging inputs
        run: bash scripts/verify-nix-packaging.sh
