name: BearBrowser credential broker

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  credential-broker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BearBrowser
        uses: actions/checkout@v4

      - name: Validate credential broker policy
        run: bash scripts/verify-credential-broker.sh
