name: BearBrowser macOS build (Gecko)

# Builds the real Gecko-based BearBrowser.app on Apple hardware.
# Peer of the GCP Linux build (scripts/gcp-build-linux.sh); this one runs the
# same driver (scripts/build-macos-local.sh) on a GitHub-hosted macOS runner
# because Firefox will not compile on non-Apple OS.
#
# Triggers: manual (workflow_dispatch) and tags matching v* (release cuts).
# NOT on PR by default — a full Gecko compile is ~3-4 hours of GHA time.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Profile to build"
        required: true
        default: "human-secure"
        type: choice
        options:
          - human-secure
          - tor-mode
          - agent-runtime
      arch:
        description: "Runner architecture"
        required: true
        default: "arm64"
        type: choice
        options:
          - arm64
          - x86_64
      ref:
        description: "Mirror ref. human-secure/agent-runtime need 'latest' (anti-fp patches are 150-authored); tor-mode self-pins 140."
        required: true
        default: "latest"
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: build-macos-${{ github.ref }}-${{ inputs.profile || 'default' }}-${{ inputs.arch || 'arm64' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.profile || 'human-secure' }} (${{ inputs.arch || 'arm64' }})
    # macos-14 = arm64 (M-series); macos-13 = x86_64 (Intel). Set by input.
    runs-on: ${{ inputs.arch == 'x86_64' && 'macos-13' || 'macos-14' }}
    timeout-minutes: 360   # 6h ceiling; typical build ~3h on GHA arm64.
    env:
      MOZBUILD_STATE_PATH: ${{ github.workspace }}/.mozbuild

    steps:
      - name: Checkout BearBrowser
        uses: actions/checkout@v4

      - name: Preflight — disk, tools, Xcode
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          xcode-select -p
          df -h .
          # GHA macos-14 runners ship ~200 GB free — plenty for one profile.
          # If we ever add multi-profile, reassess.
          echo "cores: $(sysctl -n hw.ncpu)  mem_gb: $(( $(sysctl -n hw.memsize) / 1073741824 ))"

      - name: Install build-time deps (mercurial, wget)
        run: |
          set -euo pipefail
          # python3 + git + curl are preinstalled. hg + wget are not.
          brew install mercurial wget

      - name: Cache mach bootstrap toolchain
        uses: actions/cache@v4
        with:
          path: ${{ env.MOZBUILD_STATE_PATH }}
          # Bootstrap output = clang/rust/cbindgen/node/watchman versions pinned
          # by upstream. Rev the key when we bump the mirror ref.
          key: mach-bootstrap-${{ runner.os }}-${{ runner.arch }}-v1
          restore-keys: |
            mach-bootstrap-${{ runner.os }}-${{ runner.arch }}-

      - name: Build BearBrowser (${{ inputs.profile || 'human-secure' }})
        run: |
          set -euo pipefail
          bash scripts/build-macos-local.sh \
            --profile "${{ inputs.profile || 'human-secure' }}" \
            --ref "${{ inputs.ref || '140.0.4-1' }}" \
            --artifacts "$GITHUB_WORKSPACE/build/macos-artifacts"

      - name: Compute + record SHA256
        if: success()
        run: |
          set -euo pipefail
          cd build/macos-artifacts
          ls -lh
          shasum -a 256 *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Upload BearBrowser artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bearbrowser-${{ inputs.profile || 'human-secure' }}-macos-${{ inputs.arch || 'arm64' }}
          path: |
            build/macos-artifacts/*.tar.gz
            build/macos-artifacts/*.sha256
            build/macos-artifacts/SHA256SUMS
          retention-days: 30
          if-no-files-found: error

      - name: Upload build + overlay logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bearbrowser-${{ inputs.profile || 'human-secure' }}-macos-${{ inputs.arch || 'arm64' }}-logs
          path: |
            build/macos-artifacts/**/*.log
          retention-days: 14
          if-no-files-found: ignore
