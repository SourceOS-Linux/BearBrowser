name: BearBrowser Nightly Linux

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'settings/**'
      - 'scripts/bearbrowser-patches.py'
      - 'branding/**'

jobs:
  nightly-linux:
    name: Build and package (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      MOZBUILD_STATE_PATH: ${{ github.workspace }}/.mozbuild
      VERSION: 150.0.1
      RELEASE: 1
      PROFILE: human-secure

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential curl git python3 python3-pip \
            libgtk-3-dev libdbus-glib-1-dev libxt-dev \
            libx11-xcb-dev libxcb-shm0-dev libxcb-composite0-dev \
            nasm yasm \
            libpulse-dev libasound2-dev \
            zip unzip

      - name: Cache Mozilla toolchain
        uses: actions/cache@v4
        with:
          path: .mozbuild
          key: mozbuild-${{ env.VERSION }}-ubuntu24-v1
          restore-keys: mozbuild-${{ env.VERSION }}-ubuntu24-

      - name: Cache Firefox source tarball
        uses: actions/cache@v4
        with:
          path: build/workspaces/${{ env.PROFILE }}-${{ env.VERSION }}-${{ env.RELEASE }}/source/firefox-${{ env.VERSION }}.source.tar.xz
          key: ff-tarball-${{ env.VERSION }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ env.VERSION }}-ubuntu24-v1

      - name: Set up workspace from LibreWolf mirror
        run: |
          bash scripts/apply-sourceos-overlays.sh \
            --profile ${{ env.PROFILE }} \
            --ref latest \
            --workspace-root build/workspaces

      - name: Fetch Firefox source tarball
        working-directory: build/workspaces/${{ env.PROFILE }}-${{ env.VERSION }}-${{ env.RELEASE }}/source
        run: make fetch

      - name: Apply BearBrowser patches
        working-directory: build/workspaces/${{ env.PROFILE }}-${{ env.VERSION }}-${{ env.RELEASE }}/source
        run: make dir

      - name: Bootstrap Gecko build environment
        working-directory: build/workspaces/${{ env.PROFILE }}-${{ env.VERSION }}-${{ env.RELEASE }}/source/bearbrowser-${{ env.VERSION }}-${{ env.RELEASE }}
        run: |
          MOZBUILD_STATE_PATH=${{ github.workspace }}/.mozbuild \
            ./mach --no-interactive bootstrap --application-choice=browser

      - name: Build BearBrowser
        working-directory: build/workspaces/${{ env.PROFILE }}-${{ env.VERSION }}-${{ env.RELEASE }}/source/bearbrowser-${{ env.VERSION }}-${{ env.RELEASE }}
        run: MOZBUILD_STATE_PATH=${{ github.workspace }}/.mozbuild ./mach build

      - name: Package — tarball
        id: tarball
        run: |
          DATE=$(date +%Y%m%d)
          OBJ="build/workspaces/${{ env.PROFILE }}-${{ env.VERSION }}-${{ env.RELEASE }}/source/bearbrowser-${{ env.VERSION }}-${{ env.RELEASE }}/obj-x86_64-pc-linux-gnu"
          DIST="$OBJ/dist"
          TAR="BearBrowser-${{ env.VERSION }}-${DATE}-linux-x86_64.tar.bz2"
          mkdir -p build/nightly
          tar -C "$DIST" -cjf "build/nightly/${TAR}" bearbrowser/
          echo "name=${TAR}" >> $GITHUB_OUTPUT
          echo "path=build/nightly/${TAR}" >> $GITHUB_OUTPUT

      - name: Package — AppImage
        id: appimage
        run: |
          DATE=$(date +%Y%m%d)
          bash scripts/package-linux-appimage.sh \
            --workspace "build/workspaces/${{ env.PROFILE }}-${{ env.VERSION }}-${{ env.RELEASE }}/source/bearbrowser-${{ env.VERSION }}-${{ env.RELEASE }}" \
            --out-dir build/nightly \
            --version ${{ env.VERSION }} || echo "AppImage packaging failed (non-fatal)" >&2
          APPIMG="BearBrowser-${{ env.VERSION }}-${DATE}-x86_64.AppImage"
          if [ -f "build/nightly/${APPIMG}" ]; then
            echo "name=${APPIMG}" >> $GITHUB_OUTPUT
            echo "path=build/nightly/${APPIMG}" >> $GITHUB_OUTPUT
          fi

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.tarball.outputs.name }}
          path: ${{ steps.tarball.outputs.path }}
          retention-days: 30

      - name: Upload AppImage artifact
        if: steps.appimage.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.appimage.outputs.name }}
          path: ${{ steps.appimage.outputs.path }}
          retention-days: 30

      - name: Publish nightly release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%Y-%m-%d)
          TAG="nightly-${DATE}"
          ASSETS=()
          [ -f "${{ steps.tarball.outputs.path }}" ] && ASSETS+=("${{ steps.tarball.outputs.path }}")
          [ -n "${{ steps.appimage.outputs.path }}" ] && [ -f "${{ steps.appimage.outputs.path }}" ] && ASSETS+=("${{ steps.appimage.outputs.path }}")
          if [ ${#ASSETS[@]} -gt 0 ]; then
            # Append to same-day release created by macOS job, or create if first
            gh release upload "$TAG" "${ASSETS[@]}" --clobber 2>/dev/null || \
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "BearBrowser Nightly ${DATE}" \
              --notes "Automated nightly build from \`main\` — Linux x86_64.

**Not signed. Developer use only.**

Tarball: extract and run \`bearbrowser/bearbrowser\`.
AppImage: \`chmod +x BearBrowser-*.AppImage && ./BearBrowser-*.AppImage\`

Commit: \`${{ github.sha }}\`
Firefox base: ${{ env.VERSION }}" \
              --prerelease
          fi
