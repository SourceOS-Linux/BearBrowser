name: BearBrowser Nightly Linux

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'BearBrowser release version to bake into artifact filename (upstream Firefox version stays pinned at 150.0.1). Defaults to nightly.'
        required: false
        default: ''
        type: string
  push:
    # anti-fingerprint-verify added so the compile can be triggered on this branch
    # (workflow_dispatch only works from the default branch, which is behind).
    # Remove the branch + the extra paths once merged to main.
    branches: [main, anti-fingerprint-verify]
    paths:
      - 'settings/**'
      - 'scripts/bearbrowser-patches.py'
      - 'branding/**'
      - 'gecko-patches/**'
      - 'packaging/bundled-fonts/**'
      - '.github/workflows/nightly-linux.yml'

# Needed by the "Publish nightly release" step: the default GITHUB_TOKEN is
# read-only, so `gh release upload --clobber` / `gh release create` 403 without
# this (same fix already on nightly-dmg + nightly-windows). Without write, the
# --clobber upload silently failed and the fallback create errored on the tag
# that a sibling lane had already made.
permissions:
  contents: write

jobs:
  nightly-linux:
    name: Build (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    # fedora builds in a container where swapon isn't available, so it can't get
    # the OOM headroom the ubuntu leg does; it also hits a mirror-recipe cfg-copy
    # quirk. Keep it as a best-effort signal — ubuntu is the primary Linux
    # artifact and must stay blocking. (Revisit fedora once CI moves to the
    # sovereign runner with real RAM.)
    continue-on-error: ${{ matrix.distro == 'fedora' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            container: ""
            pkg_update: sudo apt-get update -qq
            pkg_install: >-
              sudo apt-get install -y --no-install-recommends
              build-essential curl git python3 python3-pip
              libgtk-3-dev libdbus-glib-1-dev libxt-dev
              libx11-xcb-dev libxcb-shm0-dev libxcb-composite0-dev
              nasm yasm libpulse-dev libasound2-dev zip unzip
            artifact_suffix: linux-x86_64-ubuntu
            appimage_suffix: x86_64

          - distro: fedora
            container: fedora:41
            pkg_update: dnf makecache -q
            pkg_install: >-
              dnf install -y
              gcc gcc-c++ make python3 python3-pip git curl wget which
              gtk3-devel dbus-glib-devel libXt-devel libXcomposite-devel
              libxcb-devel pulseaudio-libs-devel alsa-lib-devel
              nasm yasm zip unzip findutils diffutils patch
            artifact_suffix: linux-x86_64-fedora
            appimage_suffix: x86_64-fedora

    container: ${{ matrix.container != '' && matrix.container || null }}

    env:
      MOZBUILD_STATE_PATH: ${{ github.workspace }}/.mozbuild
      # VERSION = pinned UPSTREAM Firefox tarball (workspace paths, cache
      # keys, tarball URL). Never overridden — the upstream source is what
      # it is.
      VERSION: 150.0.1
      # BEARBROWSER_VERSION = what we ship as. Baked into the tarball
      # filename. workflow_dispatch input overrides for release cuts.
      BEARBROWSER_VERSION: ${{ inputs.release_version != '' && inputs.release_version || '150.0.1' }}
      RELEASE: 1
      PROFILE: human-secure

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space (Firefox build needs ~40GB)
        if: matrix.container == ''
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Add swap (16GB runners OOM the Firefox compile → exit 143)
        if: matrix.container == ''
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile || true
          sudo fallocate -l 24G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install system dependencies
        run: |
          ${{ matrix.pkg_update }}
          ${{ matrix.pkg_install }}

      # Optional cockpit toolchain — best-effort so an install failure does not
      # break the whole nightly. The stager no-ops without an assembled cockpit.
      - name: Install cockpit toolchain (best effort)
        if: matrix.container == ''
        continue-on-error: true
        run: |
          # Pin bun to a released version — curl-piping to an unpinned URL is
          # the moving-tag trap (per memory: :latest = fix never rolls out).
          # Update this deliberately when we bump.
          BUN_VERSION=1.1.42
          curl -fsSL "https://bun.sh/install" | BUN_VERSION="bun-v${BUN_VERSION}" bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          npm install -g pnpm@9.15.4 || true

      - name: Cache Mozilla toolchain
        uses: actions/cache@v4
        with:
          path: .mozbuild
          key: mozbuild-${{ env.VERSION }}-${{ matrix.distro }}-v1
          restore-keys: mozbuild-${{ env.VERSION }}-${{ matrix.distro }}-

      - name: Cache Firefox source tarball
        uses: actions/cache@v4
        with:
          path: build/workspaces/${{ env.PROFILE }}-${{ env.VERSION }}-${{ env.RELEASE }}/source/firefox-${{ env.VERSION }}.source.tar.xz
          key: ff-tarball-${{ env.VERSION }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ env.VERSION }}-${{ matrix.distro }}-v1

      - name: Set up workspace from LibreWolf mirror
        run: |
          bash scripts/apply-sourceos-overlays.sh \
            --profile ${{ env.PROFILE }} \
            --ref latest \
            --workspace-root build/workspaces

      - name: Fetch Firefox source tarball
        working-directory: build/workspaces/${{ env.PROFILE }}-${{ env.VERSION }}-${{ env.RELEASE }}/source
        run: make fetch

      - name: Apply BearBrowser patches
        working-directory: build/workspaces/${{ env.PROFILE }}-${{ env.VERSION }}-${{ env.RELEASE }}/source
        run: make dir

      - name: Bootstrap Gecko build environment
        working-directory: build/workspaces/${{ env.PROFILE }}-${{ env.VERSION }}-${{ env.RELEASE }}/source/bearbrowser-${{ env.VERSION }}-${{ env.RELEASE }}
        run: |
          MOZBUILD_STATE_PATH=${{ github.workspace }}/.mozbuild \
            ./mach --no-interactive bootstrap --application-choice=browser

      - name: Build BearBrowser
        working-directory: build/workspaces/${{ env.PROFILE }}-${{ env.VERSION }}-${{ env.RELEASE }}/source/bearbrowser-${{ env.VERSION }}-${{ env.RELEASE }}
        # -j2: mach's memory heuristic over-parallelizes on the 16GB runner and
        # OOM-kills the compile (exit 143). Cap concurrent heavy TUs; the 24G
        # swap above absorbs the rest. Same fix as nightly-windows.
        run: MOZBUILD_STATE_PATH=${{ github.workspace }}/.mozbuild ./mach build -j2

      - name: Measure fingerprint on the REAL compiled binary (authoritative)
        if: matrix.distro == 'ubuntu'
        continue-on-error: true
        run: |
          OBJ="build/workspaces/${{ env.PROFILE }}-${{ env.VERSION }}-${{ env.RELEASE }}/source/bearbrowser-${{ env.VERSION }}-${{ env.RELEASE }}/obj-x86_64-pc-linux-gnu"
          bin="$(find "$OBJ/dist" -type f \( -name bearbrowser -o -name firefox \) 2>/dev/null | grep -vE '\.so|crashreporter|minidump|pingsender|updater' | head -1)"
          echo "real binary: $bin"
          npm ci || npm install
          export PATH="$PWD/node_modules/.bin:$PATH"
          # The compiled binary has our patches + fonts. This is the authoritative
          # scorecard: it shows what Playwright masks (timezone, real letterboxing)
          # and whether canvas-text-metric/audio/fonts flipped green.
          node scripts/measure-fingerprint.mjs --profile ${{ env.PROFILE }} --bin "$bin" --json > fp-real.json || true
          node scripts/measure-fingerprint.mjs --profile ${{ env.PROFILE }} --bin "$bin" || true

      - name: Upload real-binary scorecard
        if: matrix.distro == 'ubuntu'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: fp-real-binary-scorecard
          path: fp-real.json

      - name: Package — tarball
        id: tarball
        run: |
          DATE=$(date +%Y%m%d)
          SRC="build/workspaces/${{ env.PROFILE }}-${{ env.VERSION }}-${{ env.RELEASE }}/source/bearbrowser-${{ env.VERSION }}-${{ env.RELEASE }}"
          OBJ="$SRC/obj-x86_64-pc-linux-gnu"
          # `mach build` alone leaves dist/bin (a dev tree). Run `mach package` to
          # get the real distributable tarball (dist/bearbrowser-*.tar.xz, with
          # omni.ja) — the old step tarred a dist/bearbrowser/ dir that only
          # `mach package` creates, so it failed the moment the build finally
          # got far enough to package. Proven on the sovereign Linux builder.
          ( cd "$SRC" && MOZBUILD_STATE_PATH=${{ github.workspace }}/.mozbuild ./mach package )
          # Make BearNet LIVE: build the sidecar natively, then stage it + the
          # pages + geo into the unpacked app dir (GreD = dist/bearbrowser) and
          # RE-TAR that (mach's own tarball predates the staging). Best-effort —
          # BearNet degrades to "offline" if the sidecar build fails.
          CAP=""
          if command -v cargo >/dev/null 2>&1; then
            cargo build --release --manifest-path capture-sidecar/Cargo.toml \
              && CAP="$PWD/capture-sidecar/target/release/capture-sidecar" || true
          fi
          bash scripts/stage-bearnet.sh "$OBJ/dist/bearbrowser" "$CAP" || true
          # Assemble the sovereign cockpit if the toolchain is present. Best-effort:
          # the browser ships with or without it; the stager and the autoconfig
          # gate on <GreD>/cockpit existing so a missing cockpit is bit-for-bit
          # unaffected. Install cost is trivial vs the value of exercising the
          # runtime wiring nightly.
          if command -v pnpm >/dev/null && command -v bun >/dev/null; then
            bash scripts/assemble-cockpit.sh || echo "  assemble-cockpit failed — proceeding without"
          else
            echo "  pnpm/bun not present; skipping cockpit assembly"
          fi
          bash scripts/stage-cockpit.sh "$OBJ/dist/bearbrowser" || true
          # Gate: assert the hardening actually landed BEFORE we tar a shippable
          # artifact. Same control as the DMG lane — a build that lost its
          # filter lists / substitutions / stripped prefs must not ship.
          bash scripts/verify-package.sh "$OBJ/dist/bearbrowser"

          # Filename uses the RELEASE version (BEARBROWSER_VERSION), not the
          # Firefox upstream version, so release cuts produce correctly-named
          # artifacts ready for `gh release create v<version>`.
          TAR="BearBrowser-${{ env.BEARBROWSER_VERSION }}-${DATE}-${{ matrix.artifact_suffix }}.tar.xz"
          mkdir -p build/nightly
          tar -C "$OBJ/dist" -cJf "build/nightly/${TAR}" bearbrowser
          echo "name=${TAR}" >> $GITHUB_OUTPUT
          echo "path=build/nightly/${TAR}" >> $GITHUB_OUTPUT

      - name: Package — AppImage
        id: appimage
        run: |
          DATE=$(date +%Y%m%d)
          bash scripts/package-linux-appimage.sh \
            --workspace "build/workspaces/${{ env.PROFILE }}-${{ env.VERSION }}-${{ env.RELEASE }}/source/bearbrowser-${{ env.VERSION }}-${{ env.RELEASE }}" \
            --out-dir build/nightly \
            --version ${{ env.BEARBROWSER_VERSION }} || echo "AppImage packaging non-fatal" >&2
          APPIMG="BearBrowser-${{ env.BEARBROWSER_VERSION }}-${DATE}-${{ matrix.appimage_suffix }}.AppImage"
          [ -f "build/nightly/${APPIMG}" ] && echo "name=${APPIMG}" >> $GITHUB_OUTPUT && echo "path=build/nightly/${APPIMG}" >> $GITHUB_OUTPUT || true

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.tarball.outputs.name }}
          path: ${{ steps.tarball.outputs.path }}
          retention-days: 30

      - name: Upload AppImage artifact
        if: steps.appimage.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.appimage.outputs.name }}
          path: ${{ steps.appimage.outputs.path }}
          retention-days: 30

      # Runtime audit — a REAL browser run against the tarball we just built.
      # Ubuntu only: fedora runs in a container without apt and without xvfb
      # from Mozilla toolchains, and it's continue-on-error anyway. Splitting
      # this out (instead of leaving it inline in "Package — tarball") makes
      # the distro guard explicit and lets us always upload the report — pass
      # or fail — so we can diff over time and see slow drift.
      - name: Runtime audit (ubuntu only)
        if: matrix.distro == 'ubuntu'
        run: |
          set -e
          SRC="build/workspaces/${{ env.PROFILE }}-${{ env.VERSION }}-${{ env.RELEASE }}/source/bearbrowser-${{ env.VERSION }}-${{ env.RELEASE }}"
          OBJ="$SRC/obj-x86_64-pc-linux-gnu"
          BIN="$OBJ/dist/bearbrowser/bearbrowser"
          [ -x "$BIN" ] || { echo "::error::bearbrowser binary missing at $BIN"; exit 1; }
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libdbus-glib-1-2 libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 libasound2t64
          command -v xvfb-run >/dev/null || { echo "::error::xvfb-run install failed"; exit 1; }
          rm -f scripts/audit/surface-report.json
          node scripts/audit/surface-audit-server.mjs > /tmp/audit-server.log 2>&1 &
          AUDIT_PID=$!
          sleep 3
          mkdir -p /tmp/bb-ci-profile
          cp settings/profiles/human-secure/user.js /tmp/bb-ci-profile/
          # Flip the vendor honeypot sink ON for this run so the same session
          # ALSO tests that BearTrapMonitor's redirect-to-sink path is real.
          # On startup Firefox pings detectportal.firefox.com; with the sink on,
          # that request is redirected to /vendor-sink and shows up as a
          # `vendor-sink` record. If nothing is recorded, the whole "we honeypot
          # them, we do not just block them" claim is theatre.
          echo 'user_pref("bearbrowser.honeypot.vendor.sink", true);' >> /tmp/bb-ci-profile/user.js
          xvfb-run -a "$BIN" -no-remote -profile /tmp/bb-ci-profile \
            "http://127.0.0.1:8099/" > /tmp/bb.log 2>&1 &
          BB_PID=$!
          # Longer timeout — cold Firefox startup on CI can push past 40s.
          for i in $(seq 1 90); do
            [ -f scripts/audit/surface-report.json ] && break
            sleep 1
          done
          pkill -TERM -P $BB_PID 2>/dev/null || true
          kill $BB_PID $AUDIT_PID 2>/dev/null || true
          if [ ! -f scripts/audit/surface-report.json ]; then
            echo "::error::runtime audit: report never arrived — browser did not reach the harness in 90s"
            tail -50 /tmp/bb.log || true
            exit 1
          fi
          node -e '
            const r = require("./scripts/audit/surface-report.json");
            const v = r.values, p = r.probes;
            const fail = [];
            if (v.hardwareConcurrency !== 2) fail.push("hardwareConcurrency=" + v.hardwareConcurrency);
            if (!v.bearTrapWrap || v.bearTrapWrap === "undefined") fail.push("actor did not run");
            if (p["WebRTC (IP leak)"] === true) fail.push("WebRTC still exposed");
            if (p["WebGPU"] === true) fail.push("WebGPU still exposed");
            if (v.sendBeacon !== "undefined") fail.push("sendBeacon still present");
            if (v.globalPrivacyControl !== true) fail.push("GPC off");
            if (fail.length) { console.error("RUNTIME AUDIT FAILED:\n  " + fail.join("\n  ")); process.exit(1); }
            console.log("RUNTIME AUDIT PASSED: hwCon=" + v.hardwareConcurrency + " wrap=" + v.bearTrapWrap);
          '
          # Vendor honeypot integration test — with the sink pref on, the
          # browser's own outbound to detectportal.firefox.com must have been
          # captured by /vendor-sink. Fetches /honeypot from the sidecar and
          # verifies at least one vendor-sink record exists.
          curl -s --max-time 5 http://127.0.0.1:8093/honeypot 2>/dev/null > /tmp/honeypot.json || true
          if [ -s /tmp/honeypot.json ]; then
            node -e '
              const j = JSON.parse(require("fs").readFileSync("/tmp/honeypot.json","utf8"));
              const sinks = (j.detections || []).filter(r => r.kind === "vendor-sink");
              if (sinks.length === 0) {
                console.error("::warning::vendor honeypot did NOT record any sink — sidecar reachable, no BearTrap redirects");
                console.error("  ring size:", (j.detections || []).length, "kinds:", [...new Set((j.detections||[]).map(r=>r.kind))].join(","));
              } else {
                console.log("VENDOR HONEYPOT VERIFIED: " + sinks.length + " sink record(s), dests: " +
                  [...new Set(sinks.map(r=>r.dest))].slice(0,5).join(", "));
              }'
          else
            echo "::warning::vendor honeypot: sidecar /honeypot did not respond (sidecar not up? honest signal, not a fail)"
          fi

      # Archive the audit report + browser log — PASS OR FAIL. Enables baseline
      # diff over time; slow drift in a surface we forgot to check surfaces
      # here first. Same discipline the RS-mirror review uses.
      - name: Archive runtime audit outputs
        if: always() && matrix.distro == 'ubuntu'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-audit-linux-${{ github.run_number }}
          path: |
            scripts/audit/surface-report.json
            /tmp/bb.log
            /tmp/audit-server.log
          if-no-files-found: warn
          retention-days: 60

      - name: Publish nightly release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%Y-%m-%d)
          TAG="nightly-${DATE}"
          ASSETS=()
          [ -f "${{ steps.tarball.outputs.path }}" ] && ASSETS+=("${{ steps.tarball.outputs.path }}")
          [ -n "${{ steps.appimage.outputs.path }}" ] && [ -f "${{ steps.appimage.outputs.path }}" ] && ASSETS+=("${{ steps.appimage.outputs.path }}")
          NOTES="$(printf 'Automated nightly build — Linux (%s).\n\nNot signed. Developer use only.\n\nCommit: `%s`\nFirefox base: %s\n' '${{ matrix.distro }}' '${{ github.sha }}' '${{ env.VERSION }}')"
          if [ ${#ASSETS[@]} -gt 0 ]; then
            # Create-if-missing, THEN upload --clobber. All three platform lanes
            # race on the same nightly-<date> tag; the old "upload || create"
            # order fell through to `create` (which errors "tag already exists")
            # whenever the clobber-upload hiccuped. This order never fails on an
            # existing release.
            gh release create "$TAG" --title "BearBrowser Nightly ${DATE}" --notes "$NOTES" --prerelease 2>/dev/null || true
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          fi
