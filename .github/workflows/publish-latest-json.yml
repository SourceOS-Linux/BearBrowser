name: Publish latest.json (on release)

# Writes and uploads a small update manifest to any release. The client fetches
# https://github.com/SourceOS-Linux/BearBrowser/releases/latest/download/latest.json
# once a week and shows a passive banner if a newer version exists. No
# fingerprint-bearing template, no auto-download.

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        type: string
      channel:
        description: 'Update channel (stable|canary). Default: auto-detect from tag suffix (-rc / -canary → canary)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          # Channel resolution:
          #  1. explicit workflow_dispatch input wins
          #  2. tag suffix -rc | -canary → canary
          #  3. default → stable
          CHANNEL="${{ inputs.channel }}"
          if [ -z "$CHANNEL" ]; then
            case "$TAG" in
              *-rc*|*-canary*) CHANNEL="canary" ;;
              *)               CHANNEL="stable" ;;
            esac
          fi
          echo "publishing manifest for tag=$TAG channel=$CHANNEL"
          bash scripts/publish-latest-json.sh "$TAG" --channel "$CHANNEL"
