name: BearBrowser shell validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  shell-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BearBrowser
        uses: actions/checkout@v4

      - name: Validate shell script syntax
        run: |
          bash -n scripts/apply-sourceos-overlays.sh
          bash -n scripts/verify-upstream-parity.sh
          bash -n scripts/sync-librewolf-mirror.sh
          bash -n scripts/bearbrowser-doctor.sh
          bash -n scripts/bearbrowser-update.sh
          bash -n scripts/bearbrowser-automation-surfaces.sh
          bash -n packaging/homebrew/promote-to-tap.sh
