name: css-policy
on:
  pull_request:
    paths:
      - "schemas/css-policy.schema.json"
      - "schemas/deception-signal.schema.json"
      - "examples/css-policy.*.json"
      - "examples/deception-signal.*.json"
      - "scripts/verify-css-policy.py"
      - ".github/workflows/css-policy.yml"
  push:
    branches: [ main, master ]
    paths:
      - "schemas/css-policy.schema.json"
      - "schemas/deception-signal.schema.json"
      - "examples/css-policy.*.json"
      - "examples/deception-signal.*.json"
      - "scripts/verify-css-policy.py"
      - ".github/workflows/css-policy.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-css-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Verify CSS policy + deception signals
        run: python3 scripts/verify-css-policy.py
