name: macOS sign + notarize (dispatch)

# GATED on the four Apple secrets existing — until then the workflow no-ops with
# a clear message. Michael has deliberately deferred signing (no paid certs
# yet); when he flips it on, this pipeline turns a DMG green in ~10 minutes.
#
# Inputs a released nightly/stable tag, produces a signed+notarized+stapled DMG
# alongside the unsigned one on the SAME release. Idempotent — re-runs are
# safe and overwrite the -signed asset.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sign (e.g. v150.0.4)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  sign-notarize:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Guard on secrets
        env:
          IDENT: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASS: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_P12: ${{ secrets.APPLE_P12_BASE64 }}
          APPLE_P12_PASS: ${{ secrets.APPLE_P12_PASSWORD }}
        run: |
          MISSING=""
          for v in IDENT APPLE_ID APPLE_APP_PASS APPLE_TEAM_ID APPLE_P12 APPLE_P12_PASS; do
            [ -z "${!v:-}" ] && MISSING="$MISSING $v"
          done
          if [ -n "$MISSING" ]; then
            echo "::warning::Signing skipped — missing secrets:${MISSING}"
            echo "  Set them on the repo, then re-run this workflow. Nothing else changes."
            echo "SKIP=1" >> "$GITHUB_ENV"
          else
            echo "  All 6 secrets present. Proceeding to sign + notarize."
          fi

      - name: Download unsigned DMG from the release
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" \
            --pattern '*-macos.dmg' --clobber
          ls -la *-macos.dmg

      - name: Import signing identity
        if: env.SKIP != '1'
        env:
          APPLE_P12: ${{ secrets.APPLE_P12_BASE64 }}
          APPLE_P12_PASS: ${{ secrets.APPLE_P12_PASSWORD }}
        run: |
          set -euo pipefail
          # Ephemeral keychain — never persists on the runner.
          KEYCHAIN=$RUNNER_TEMP/bb-sign.keychain-db
          KEYCHAIN_PASS=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "$APPLE_P12" | base64 -d > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN" -P "$APPLE_P12_PASS" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          rm -f $RUNNER_TEMP/cert.p12
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASS=$KEYCHAIN_PASS" >> "$GITHUB_ENV"

      - name: Sign, notarize, staple
        if: env.SKIP != '1'
        env:
          IDENT: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASS: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          DMG=$(ls *-macos.dmg | head -1)
          MP=$(hdiutil attach "$DMG" -nobrowse -readonly | grep -o '/Volumes/.*' | head -1)
          cp -R "$MP/BearBrowser.app" ./BearBrowser.app
          hdiutil detach "$MP" -quiet
          # Sign INSIDE-OUT: dylibs and helper .apps first, then the outer bundle.
          find ./BearBrowser.app/Contents/MacOS \( -name "*.dylib" -o -name "*.app" \) -print0 \
            | while IFS= read -r -d '' n; do
                codesign --force --timestamp --options runtime \
                  --entitlements packaging/macos/entitlements.plist \
                  --sign "$IDENT" --keychain "$KEYCHAIN" "$n"
              done
          codesign --force --deep --timestamp --options runtime \
            --entitlements packaging/macos/entitlements.plist \
            --sign "$IDENT" --keychain "$KEYCHAIN" ./BearBrowser.app
          codesign --verify --deep --strict --verbose=2 ./BearBrowser.app
          # Re-DMG the signed app, then notarize the DMG (Apple notarizes the outer).
          # Re-create the DMG using the SAME filename so downstream URLs
          # (brew tap, docs, direct links) auto-pick up the signed one on
          # --clobber. If we ever need both to coexist, promote to two names.
          hdiutil create -fs HFS+ -srcfolder ./BearBrowser.app -volname BearBrowser \
            -ov -format UDZO "$DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASS" --wait
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature -vvv "$DMG"
          echo "SIGNED_DMG=$DMG" >> "$GITHUB_ENV"

      - name: Upload signed DMG to the release (same filename, --clobber)
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Also regenerate SHA256SUMS.txt to reflect the new signed DMG so the
          # checksum on the release page matches what users actually download.
          shasum -a 256 "$SIGNED_DMG" > NEW_SUMS.txt
          gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" \
            --pattern 'SHA256SUMS.txt' --clobber || echo "no existing sums"
          if [ -f SHA256SUMS.txt ]; then
            grep -v "$(basename "$SIGNED_DMG")" SHA256SUMS.txt >> NEW_SUMS.txt || true
            sort -u NEW_SUMS.txt > SHA256SUMS.txt
            gh release upload "${{ inputs.tag }}" SHA256SUMS.txt \
              --clobber -R "${{ github.repository }}"
          fi
          gh release upload "${{ inputs.tag }}" "$SIGNED_DMG" \
            --clobber -R "${{ github.repository }}"
