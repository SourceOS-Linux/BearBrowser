name: BearBrowser Nightly DMG

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'settings/**'
      - 'scripts/bearbrowser-patches.py'
      - 'branding/**'

# gh release create needs contents:write; the default token is read-only,
# which 403'd ("Resource not accessible by integration") after a clean build.
permissions:
  contents: write

jobs:
  nightly-dmg:
    name: Build and package (macOS)
    runs-on: macos-26
    timeout-minutes: 360

    env:
      MOZBUILD_STATE_PATH: ${{ github.workspace }}/.mozbuild
      VERSION: 150.0.1
      RELEASE: 1
      PROFILE: human-secure

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Mozilla toolchain
        uses: actions/cache@v4
        with:
          path: .mozbuild
          key: mozbuild-${{ env.VERSION }}-macos26-v1
          restore-keys: mozbuild-${{ env.VERSION }}-macos26-

      - name: Cache Firefox source tarball
        uses: actions/cache@v4
        with:
          path: build/workspaces/${{ env.PROFILE }}-${{ env.VERSION }}-${{ env.RELEASE }}/source/firefox-${{ env.VERSION }}.source.tar.xz
          key: ff-tarball-${{ env.VERSION }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ env.VERSION }}-macos26-v1

      - name: Set up workspace from LibreWolf mirror
        run: |
          bash scripts/apply-sourceos-overlays.sh \
            --profile ${{ env.PROFILE }} \
            --ref latest \
            --workspace-root build/workspaces

      - name: Fetch Firefox source tarball
        working-directory: build/workspaces/${{ env.PROFILE }}-${{ env.VERSION }}-${{ env.RELEASE }}/source
        run: make fetch

      - name: Apply BearBrowser patches
        working-directory: build/workspaces/${{ env.PROFILE }}-${{ env.VERSION }}-${{ env.RELEASE }}/source
        run: make dir

      - name: Provision sovereign macOS SDK + install unpack-sdk shim
        working-directory: build/workspaces/${{ env.PROFILE }}-${{ env.VERSION }}-${{ env.RELEASE }}/source/bearbrowser-${{ env.VERSION }}-${{ env.RELEASE }}
        run: |
          set -euo pipefail
          # `mach bootstrap` fetches the macOS SDK via taskcluster/.../unpack-sdk.py,
          # which HTTP 403s off Mozilla's CI network (Apple's SDK can't be
          # redistributed) — this is what has kept nightly-dmg red. Package the
          # runner's LICENSED Xcode SDK into our own artifact and swap in a shim
          # that serves it from that local copy instead of downloading.
          eval "$(bash "$GITHUB_WORKSPACE/scripts/provision-macos-sdk.sh")"
          echo "BEARBROWSER_MACOS_SDK=$BEARBROWSER_MACOS_SDK" >> "$GITHUB_ENV"
          cp "$GITHUB_WORKSPACE/scripts/sovereign-unpack-sdk.py" \
            taskcluster/scripts/misc/unpack-sdk.py
          echo "installed sovereign unpack-sdk shim (SDK: $BEARBROWSER_MACOS_SDK)"

      - name: Bootstrap Gecko build environment
        working-directory: build/workspaces/${{ env.PROFILE }}-${{ env.VERSION }}-${{ env.RELEASE }}/source/bearbrowser-${{ env.VERSION }}-${{ env.RELEASE }}
        run: |
          # `mach bootstrap` fetches the host clang via `mach artifact toolchain
          # --from-build`, which needs a mozilla-central task index and FAILS on our
          # LibreWolf fork ("Could not find artifacts for toolchain-macosx64-aarch64-
          # clang"). On Linux the same command resolves clang via the public index;
          # macOS does not. macos-26 ships Xcode's clang, so we tolerate the
          # toolchain-fetch failure here and build with the runner's own clang below.
          # (rustup + the SDK are already provisioned by the prior steps.)
          # tolerate the fork-broken clang toolchain fetch; mach build uses the
          # runner's Xcode clang unless the mozconfig forces --enable-bootstrap
          # (which the next run will reveal).
          MOZBUILD_STATE_PATH=${{ github.workspace }}/.mozbuild \
            ./mach --no-interactive bootstrap --application-choice=browser \
            || echo "::warning::mach bootstrap toolchain fetch failed (expected on a fork) — building with the runner's Xcode clang"

      - name: Configure build for the runner's Xcode toolchain
        working-directory: build/workspaces/${{ env.PROFILE }}-${{ env.VERSION }}-${{ env.RELEASE }}/source/bearbrowser-${{ env.VERSION }}-${{ env.RELEASE }}
        run: |
          set -euo pipefail
          # mach build reads ./mozconfig here (confirmed from the run log). It has
          # --enable-bootstrap, which fetches Mozilla's toolchains via
          # `mach artifact toolchain --from-build` — broken on our fork. `no-update`
          # still fetches, so fully DISABLE bootstrap and build with the runner's own
          # toolchain: Xcode clang (CC/CXX), our provisioned SDK, and the small
          # extras Firefox needs that bootstrap would otherwise supply (nasm,
          # cbindgen). rust + node are preinstalled on macos-26.
          # Toolchain from the runner (bootstrap fetch is fork-broken):
          #   - clang: Xcode's. Clang version is NOT the cause — clang 19 (llvm@19)
          #     and 21 (Xcode) both hit the same webrender COUNT error, so keep the
          #     simpler Xcode clang.
          #   - lld: Firefox's macOS linker (Xcode doesn't ship it).
          #   - cbindgen: PINNED to v0.29.1 (git tag eef1776) — FF 150.0.1's stated
          #     minimum, i.e. its build version. v0.29.4 (b826cb8, the LATEST 0.29.x,
          #     from a newer Firefox) emits a webrender_ffi macOS-only block
          #     (`#if defined(XP_MACOSX)` — hence Linux is fine) referencing an
          #     undeclared COUNT — a codegen regression after 0.29.1, failing ~27min
          #     in. Install from the git TAG with --locked (crates.io 0.29.1 won't
          #     compile against current serde; the tag's own Cargo.lock pins a
          #     compatible one). Clang is NOT the cause (19 and 21 fail identically).
          brew install nasm lld
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          cargo install --git https://github.com/mozilla/cbindgen \
            --tag v0.29.1 --locked cbindgen
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          {
            echo ""
            echo "# nightly-dmg: build with the runner's toolchain (fork can't fetch Mozilla's)"
            echo "ac_add_options --disable-bootstrap"
            echo "export CC=$(xcrun -f clang)"
            echo "export CXX=$(xcrun -f clang++)"
            echo "ac_add_options --with-macos-sdk=${BEARBROWSER_MACOS_SDK}"
            echo "ac_add_options --enable-linker=lld"
            echo "ac_add_options --without-wasm-sandboxed-libraries"
          } >> mozconfig
          echo "appended to mozconfig:"; tail -6 mozconfig

      - name: Build BearBrowser
        working-directory: build/workspaces/${{ env.PROFILE }}-${{ env.VERSION }}-${{ env.RELEASE }}/source/bearbrowser-${{ env.VERSION }}-${{ env.RELEASE }}
        run: MOZBUILD_STATE_PATH=${{ github.workspace }}/.mozbuild ./mach build

      # `mach package` is the ONLY correct path: it JARs chrome into omni.ja, which
      # makes Firefox's IsPackagedBuild() true. Without omni.ja the content sandbox
      # takes a developer-build path (MozillaDeveloperRepoPath) that MOZ_CRASHes on
      # an end-user machine.
      #
      # The fork's package-manifest.in lists 3 hardening files (bearbrowser.cfg,
      # defaults/pref/local-settings.js, distribution/policies.json) the build never
      # emits — so `mach package` aborts. Staging them into dist/bin does NOT work:
      # `mach package` repopulates dist/bin from the build's install manifests first
      # and wipes non-manifest files. So instead drop those 3 required entries from
      # the manifest (the packager's accumulated error listed exactly these 3). Our
      # post-package script injects policies.json + hardened prefs into the final
      # app anyway, so nothing is lost.
      - name: Relax packager manifest (drop 3 fork files the build doesn't emit)
        working-directory: build/workspaces/${{ env.PROFILE }}-${{ env.VERSION }}-${{ env.RELEASE }}/source/bearbrowser-${{ env.VERSION }}-${{ env.RELEASE }}
        run: |
          set -euo pipefail
          M=browser/installer/package-manifest.in
          before=$(wc -l < "$M")
          grep -vE 'bearbrowser\.cfg|defaults/pref/local-settings\.js|distribution/policies\.json' "$M" > "$M.tmp"
          mv "$M.tmp" "$M"
          echo "package-manifest.in: $before -> $(wc -l < "$M") lines"
          # Drop any already-preprocessed manifest so mach package regenerates it.
          find . -maxdepth 3 -name 'package-manifest' -path '*dist*' -delete 2>/dev/null || true

      - name: Package the Gecko app (mach package → omni.ja)
        working-directory: build/workspaces/${{ env.PROFILE }}-${{ env.VERSION }}-${{ env.RELEASE }}/source/bearbrowser-${{ env.VERSION }}-${{ env.RELEASE }}
        run: MOZBUILD_STATE_PATH=${{ github.workspace }}/.mozbuild ./mach package

      - name: Package BearBrowser.app
        run: |
          bash scripts/bearbrowser-package-source-build.sh \
            --workspace build/workspaces/${{ env.PROFILE }}-${{ env.VERSION }}-${{ env.RELEASE }}/source/bearbrowser-${{ env.VERSION }}-${{ env.RELEASE }} \
            --profile ${{ env.PROFILE }} \
            --out-dir build/nightly \
            --version ${{ env.VERSION }} \
            --skip-verify

      - name: Create DMG
        id: dmg
        run: |
          DATE=$(date +%Y%m%d)
          DMG="BearBrowser-${{ env.VERSION }}-${DATE}-dev.dmg"
          hdiutil create \
            -volname "BearBrowser" \
            -srcfolder "build/nightly/BearBrowser.app" \
            -ov -format UDZO \
            "build/nightly/${DMG}"
          echo "name=${DMG}" >> $GITHUB_OUTPUT
          echo "path=build/nightly/${DMG}" >> $GITHUB_OUTPUT

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dmg.outputs.name }}
          path: ${{ steps.dmg.outputs.path }}
          retention-days: 30

      - name: Publish nightly release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%Y-%m-%d)
          TAG="nightly-${DATE}"
          # Replace any same-day release rather than fail on duplicate tag
          gh release delete "$TAG" --yes 2>/dev/null || true
          NOTES="$(printf '%s\n' \
            'Automated nightly build from `main`.' \
            '' \
            '**Not notarized — developer use only.**' \
            'To open: right-click BearBrowser.app → Open (bypasses Gatekeeper).' \
            '' \
            "Commit: \`${{ github.sha }}\`" \
            "Firefox base: ${{ env.VERSION }}")"
          gh release create "$TAG" \
            "${{ steps.dmg.outputs.path }}" \
            --title "BearBrowser Nightly ${DATE}" \
            --notes "$NOTES" \
            --prerelease
