name: BearBrowser Linux packaging

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  linux-packaging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BearBrowser
        uses: actions/checkout@v4

      - name: Install metadata validators
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils libxml2-utils

      - name: Validate Linux packaging metadata
        run: bash scripts/verify-linux-packaging.sh
