name: macOS cross build (human-secure)

# Cross-compiles BearBrowser (human-secure) to macOS arm64 on the epsilon Forgejo
# runner using the bsys6-macos image — no Apple hardware, no GitHub, no
# Mozilla/Apple CDN. All toolchain inputs (macOS SDK, cctools, clang) come from the
# image, which is built from our registry (zot). See docs/macos-cross-build.md.
#
# Peer of tor-mode-esr.yaml. Same overlay pipeline; only the build image + mozconfig
# (cross target) differ. TODO(validate-on-epsilon): expect a few rounds tuning the
# cross mozconfig / cctools path before `make build` is green — that iteration
# happens here, on our infra.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Mirror ref (human-secure builds on latest / 150)'
        required: false
        default: 'latest'

jobs:
  macos-cross:
    runs-on: epsilon
    container:
      # Built + pushed from ci/bsys6-macos/Dockerfile. Move to zot once available:
      #   image: registry.<sovereign>/bearbrowser/bsys6-macos:<sdkver>
      image: codeberg.org/bearbrowser/bsys6-macos:latest
    steps:
      - name: Checkout overlay
        uses: actions/checkout@v6

      - name: Install overlay deps
        run: |
          apt-get update
          apt-get -y install --no-install-recommends git pigz gnupg python3 wget

      - name: Materialize the human-secure workspace (overlay prep)
        env:
          BB_REF: ${{ github.event.inputs.ref }}
        run: |
          bash scripts/apply-sourceos-overlays.sh --profile human-secure --ref "${BB_REF:-latest}"
          ws="$(find build/workspaces -maxdepth 2 -type d -name source | tail -1)"
          echo "WS=$ws" >> "$GITHUB_ENV"
          echo "workspace: $ws (version=$(cat "$ws/version"))"
          # Install the CROSS mozconfig (target=aarch64-apple-darwin, SDK from image).
          cp mozconfig/human-secure-macos-cross.mozconfig "$ws/assets/mozconfig"
          echo "-- SDK in image --"; ls -d "${BEARBROWSER_MACOS_SDK:-/opt/bearbrowser/macos-sdk}" || echo "SDK MISSING"

      - name: Cross-compile (make build)
        run: |
          cd "$WS"
          # No mach bootstrap: the bsys6-macos image already carries clang/rust/
          # cctools + the SDK. make dir extracts+patches, then make build compiles.
          make dir
          make build

      - name: Locate the built .app
        run: |
          app="$(find "$WS" -type d -name 'BearBrowser.app' -path '*dist*' | head -1)"
          [ -n "$app" ] || app="$(find "$WS" -type d -name '*.app' -path '*dist*' | head -1)"
          [ -n "$app" ] || { echo "::error::no .app found under $WS"; exit 1; }
          echo "APP=$app" >> "$GITHUB_ENV"
          echo "built: $app"

      - name: Package + upload
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: bearbrowser-human-secure-macos-arm64
          path: ${{ env.APP }}
          retention-days: 7
      # TODO: also push the .app (as an OCI artifact) to zot for the release channel.
